<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E6E">
<title>TURA · VOR×1 — тренажёр стабилизации взора</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#F4F3EF; --card:#FFFFFF; --ink:#14222B; --ink2:#4A5963; --muted:#7A8790; --line:#E3E1DA; --grid:#ECEAE4;
  --brand:#0B6E6E; --brand-dark:#085858; --brand-soft:#DDEFEE;
  --beat:#F2A23A; --beat-soft:#FDEBD0;
  --danger:#B42318; --danger-soft:#FDE7E4; --ok:#1C7C3A; --ok-soft:#E3F3E7; --warn-soft:#FFF1D6;
  --s1:#2a78d6; --s2:#eb6834;
  --r:20px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:calc(14px + var(--st)) 16px calc(28px + var(--sb))}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.logo{width:46px;height:46px;flex:none;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.08em}
.ttl{font-size:20px;font-weight:800;line-height:1.1}
.sub{font-size:13px;color:var(--ink2);margin-top:2px}
.backbar{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.back{border:0;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:46px;padding:0 16px;font-weight:700;font-size:15px;color:var(--ink2)}
h1{font-size:26px;line-height:1.15;margin:6px 0 10px;font-weight:800;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 10px;font-weight:800}
p{line-height:1.5;margin:0 0 12px;color:var(--ink2);font-size:16px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:0 0 14px;border:1px solid var(--line);box-shadow:0 8px 24px -18px rgba(20,34,43,.35)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:16px;border:0;font-size:18px;font-weight:800;padding:14px 18px;text-align:center;line-height:1.2}
.btn-p{background:var(--brand);color:#fff}
.btn-p:active{background:var(--brand-dark)}
.btn-s{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn-d{background:var(--danger);color:#fff}
.btn-w{background:var(--beat);color:#2A1A00}
.btn + .btn{margin-top:10px}
.btn small{display:block;font-size:13px;font-weight:600;opacity:.85}
.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.navbtn{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:86px;text-align:left;display:flex;flex-direction:column;gap:4px}
.navbtn b{font-size:16px}
.navbtn span{font-size:13px;color:var(--ink2);line-height:1.35}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--bg);border-radius:14px;padding:10px 12px}
.kv small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.kv b{font-size:15px;line-height:1.3}
.meta{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.4}
.today{display:flex;align-items:center;justify-content:space-between;gap:12px}
.today b{font-size:22px}
.dots{display:flex;gap:8px}
.dot{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--brand)}
.dot.on{background:var(--brand)}
.rate{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.rate button{min-height:60px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:24px;font-weight:800}
.rate button:active{background:var(--brand-soft);border-color:var(--brand)}
.anchors{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:10px;font-weight:600}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;min-height:46px;border:0;border-radius:11px;background:transparent;font-size:14px;font-weight:700;color:var(--ink2);padding:6px 8px;line-height:1.2}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 4px rgba(20,34,43,.16)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:54px;height:54px;flex:none;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:26px;font-weight:700}
.stepper output{flex:1;text-align:center;font-size:22px;font-weight:800}
.stepper output small{font-size:14px;color:var(--ink2);font-weight:600}
.field{margin:0 0 18px}
.field > label,.flabel{display:block;font-size:13px;font-weight:800;color:var(--ink2);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
.fhint{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
input[type=text]{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);padding:0 14px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}
input[type=text]:focus{outline:2px solid var(--brand);outline-offset:1px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:14px;padding:12px 14px;border:0;width:100%;text-align:left}
.switch .knob{width:52px;height:32px;border-radius:16px;background:#C9CCC8;position:relative;flex:none;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on .knob{background:var(--brand)}
.switch.on .knob::after{left:23px}
.switch b{font-size:15px}
.note{border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.45;margin:0 0 14px}
.note b{display:block;margin-bottom:4px;font-size:16px}
.note.ok{background:var(--ok-soft);color:#0F4D24}
.note.warn{background:var(--warn-soft);color:#5C3500}
.note.danger{background:var(--danger-soft);color:#7A160F}
.note.info{background:var(--brand-soft);color:#063F3F}
.steps{list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{position:relative;padding:0 0 14px 44px;line-height:1.45;font-size:16px;color:var(--ink2)}
.steps li:last-child{padding-bottom:0}
.steps li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:-2px;width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:800;display:grid;place-items:center;font-size:15px}
.steps li b{color:var(--ink)}
ul.flags{margin:0;padding-left:20px;line-height:1.5}
ul.flags li{margin-bottom:4px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat3 div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat3 small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.stat3 b{font-size:22px;font-weight:800}
.sess{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.sess:first-of-type{border-top:0}
.sess .d{font-weight:800;font-size:15px}
.sess .x{font-size:14px;color:var(--ink2);grid-column:1/-1;line-height:1.4}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;align-self:start;white-space:nowrap}
.tag.up{background:var(--ok-soft);color:var(--ok)}
.tag.keep{background:var(--brand-soft);color:var(--brand)}
.tag.down{background:var(--warn-soft);color:#7A4600}
.tag.stop{background:var(--danger-soft);color:var(--danger)}
.chart{position:relative;margin-top:4px;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.chart .ax{font-size:11px;fill:var(--muted);font-family:inherit}
.chart .dl{font-size:12px;fill:var(--ink2);font-weight:700;font-family:inherit}
.tip{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:10px;padding:7px 10px;font-size:12px;line-height:1.4;pointer-events:none;white-space:nowrap;z-index:3}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink2);font-weight:700;margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
textarea.rep{width:100%;min-height:220px;border-radius:14px;border:1.5px solid var(--line);padding:12px;font:13px/1.45 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);margin-top:10px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:22px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;z-index:100;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:90vw;text-align:center}
.modal{position:fixed;inset:0;background:rgba(20,34,43,.45);display:grid;place-items:center;z-index:90;padding:20px}
.modal .card{max-width:420px;width:100%;margin:0}
.anim{display:flex;justify-content:center;margin:4px 0 10px}
.anim svg{width:200px;height:auto}
.anim .headg{transform-box:view-box;transform-origin:110px 150px;animation:turn 1.6s ease-in-out infinite}
.anim.v .headg{animation:nod 1.6s ease-in-out infinite;transform-origin:110px 150px}
@keyframes turn{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}
@keyframes nod{0%,100%{transform:scaleY(.86) translateY(8px)}50%{transform:scaleY(1) translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.anim .headg{animation:none}}

/* exercise */
.ex{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;background:#FFFFFF;overflow:hidden;user-select:none;-webkit-user-select:none}
.ex.bg-pattern{background:repeating-conic-gradient(#D3D9DC 0 25%,#FFFFFF 0 50%) 0 0/48px 48px}
.ex.bg-busy{background:repeating-conic-gradient(#1F2B31 0 25%,#F5F4EF 0 50%) 0 0/26px 26px}
.edge{position:absolute;background:rgba(20,34,43,.10);transition:background .07s,box-shadow .07s;z-index:1}
.edge.l{left:0;top:0;bottom:0;width:30px}.edge.r{right:0;top:0;bottom:0;width:30px}
.edge.t{top:0;left:0;right:0;height:30px}.edge.b{bottom:0;left:0;right:0;height:30px}
.edge.on{background:var(--beat);box-shadow:0 0 26px 4px rgba(242,162,58,.55)}
.ex-top{position:relative;z-index:2;margin:calc(12px + var(--st)) 42px 0;background:rgba(255,255,255,.95);border-radius:18px;padding:8px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px -8px rgba(0,0,0,.3)}
.ex.v .ex-top{margin-top:calc(40px + var(--st));margin-left:14px;margin-right:14px}
.ex-top .m{font-size:14px;font-weight:700;color:var(--ink2);line-height:1.25}
.ex-top .t{margin-left:auto;font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.ex-bar{height:6px;background:rgba(20,34,43,.12);border-radius:3px;margin:8px 42px 0;overflow:hidden;position:relative;z-index:2}
.ex.v .ex-bar{margin-left:14px;margin-right:14px}
.ex-bar i{display:block;height:100%;background:var(--brand);width:0}
.headic{width:40px;height:40px;flex:none}
.headic g{transition:transform .16s ease-out;transform-origin:20px 22px}
.ex-center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative;z-index:2;padding:0 40px}
.sym-card{background:#fff;border-radius:.16em;border:3px solid #14222B;display:grid;place-items:center;min-width:1.3em;padding:.06em .2em;line-height:1.05;font-weight:800;color:#0B1A22;font-variant-numeric:tabular-nums}
.ex-hint{background:rgba(255,255,255,.95);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:700;color:var(--ink2);max-width:320px;text-align:center;transition:opacity .6s}
.ex-hint.gone{opacity:0}
.ex-bottom{position:relative;z-index:2;padding:0 42px calc(16px + var(--sb));display:flex;gap:10px}
.ex.v .ex-bottom{padding:0 14px calc(42px + var(--sb))}
.ex-bottom .btn{min-height:62px;font-size:17px}
.overlay{position:absolute;inset:0;z-index:5;background:rgba(244,243,239,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:12px;text-align:center}
.overlay .btn{max-width:420px}
.count{font-size:min(40vmin,220px);font-weight:800;color:var(--brand);line-height:1}
#camv.parked{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1}
#camv.preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.camwrap{position:relative;width:min(72vw,300px);aspect-ratio:3/4;margin:4px auto 14px;border-radius:22px;overflow:hidden;background:#0D1A20}
.camwrap .frame{position:absolute;inset:12% 17% 20%;border:3px dashed rgba(255,255,255,.75);border-radius:50%/44%;z-index:2;pointer-events:none}
.camlive{display:inline-flex;align-items:center;gap:6px;margin-left:10px;font-size:13px;font-weight:800;color:var(--ink2)}
.camlive i{width:10px;height:10px;border-radius:50%;background:#B8C0C4;display:inline-block}
.camlive i.ok{background:var(--ok)}.camlive i.bad{background:var(--danger)}
.beta{font-size:10px;font-weight:800;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:1px 5px;margin-left:5px;vertical-align:middle;text-transform:none;letter-spacing:0}
.btn:disabled{opacity:.45}
.blurc{font-variant-numeric:tabular-nums;background:rgba(42,26,0,.14);border-radius:999px;padding:2px 12px;min-width:2.2em}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== TURA · VOR×1 — прототип V0 ===================== */
const KEY = 'tura_vor1_v0';
const DEFAULT_RX = {
  patient:'', specialist:'', dir:'h', bpm:60, maxBpm:160, setSec:30, maxSetSec:90,
  sets:2, restSec:30, perDay:3, bg:'plain', pos:'sit', dist:'near', sym:'digits', size:'l',
  auto:true, lastStep:null, setAt:null
};
const L = {
  dir:{h:'Горизонтально', v:'Вертикально'},
  dirShort:{h:'Влево-вправо', v:'Вверх-вниз'},
  bg:{plain:'Однотонный', pattern:'Узор', busy:'Пёстрый'},
  pos:{sit:'Сидя', support:'Стоя у опоры', stand:'Стоя'},
  dist:{near:'В руке, 40 см', far:'Подставка, 1,5–2 м'},
  sym:{digits:'Цифры', letters:'Буквы', arrows:'Стрелки'},
  one:{digits:'цифра', letters:'буква', arrows:'стрелка'},
  acc:{digits:'цифру', letters:'букву', arrows:'стрелку'},
  One:{digits:'Цифра', letters:'Буква', arrows:'Стрелка'},
  size:{s:'Мелкий', m:'Средний', l:'Крупный', xl:'Очень крупный'},
  clarity:['чётко','иногда расплывалась','часто расплывалась']
};
const SYMS = {
  digits:['2','3','4','5','6','7','8','9'],
  letters:['Б','Г','Д','К','Л','М','Н','Р','С','Т','Ш'],
  arrows:['↑','→','↓','←']
};
const SIZE_VMIN = {s:10, m:16, l:24, xl:34};

let storageOK = true;
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      return {
        rx: Object.assign({}, DEFAULT_RX, d.rx || {}),
        sessions: Array.isArray(d.sessions) ? d.sessions : [],
        tests: Array.isArray(d.tests) ? d.tests : [],
        safetyAck: !!d.safetyAck,
        mode: d.mode === 'helper' ? 'helper' : 'self',
        camOn: d.camOn !== false
      };
    }
  }catch(e){ storageOK = false; }
  return {rx:{...DEFAULT_RX}, sessions:[], tests:[], safetyAck:false, mode:'self', camOn:true};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); storageOK = true; }
  catch(e){ storageOK = false; }
}
let DB = load();
let view = 'home';
let S = null;          // текущая тренировка
let D = null;          // черновик назначения
let afterSafety = null;

const app = document.getElementById('app');

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const fmtSec = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + pad(s%60); };
const fmtDay = ts => { const d = new Date(ts); return pad(d.getDate()) + '.' + pad(d.getMonth()+1); };
const fmtDT = ts => { const d = new Date(ts); return fmtDay(ts) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); };
const todaySessions = () => DB.sessions.filter(s => dayKey(s.ts) === dayKey(Date.now()));
function plural(n, a, b, c){ const m10 = n % 10, m100 = n % 100; if(m10 === 1 && m100 !== 11) return a; if(m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return b; return c; }
const balls = n => n + ' ' + plural(n, 'балл', 'балла', 'баллов');
function durLabel(sec){ return sec < 60 ? sec + ' с' : (sec % 60 ? Math.floor(sec/60) + ' мин ' + (sec%60) + ' с' : (sec/60) + ' мин'); }

function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}

function header(){
  return `<div class="top"><div class="logo">TURA</div><div><div class="ttl">VOR×1</div><div class="sub">Тренажёр стабилизации взора</div></div></div>`;
}
function backbar(label='Назад', to='home'){
  return `<div class="backbar"><button class="back" data-a="go" data-v="${to}">← ${label}</button></div>`;
}
function levelKV(rx){
  return `<div class="kv">
    <div><small>Движение</small><b>${L.dirShort[rx.dir]}</b></div>
    <div><small>Темп</small><b>${rx.bpm} уд/мин</b></div>
    <div><small>Подход</small><b>${rx.sets} × ${durLabel(rx.setSec)}</b></div>
    <div><small>Фон</small><b>${L.bg[rx.bg]}</b></div>
    <div><small>Положение</small><b>${L.pos[rx.pos]}</b></div>
    <div><small>Цель</small><b>${L.sym[rx.sym]}, ${L.dist[rx.dist].split(',')[0].toLowerCase()}</b></div>
  </div>`;
}

/* ---------- screens ---------- */
function render(){
  parkVideo();
  if(S){ renderSession(); return; }
  const fn = {home:renderHome, safety:renderSafety, howto:renderHowto, history:renderHistory, rx:renderRx}[view] || renderHome;
  fn();
  window.scrollTo(0,0);
}

function renderHome(){
  const rx = DB.rx, done = todaySessions().length;
  let dots = '';
  for(let i = 0; i < Math.max(rx.perDay, done); i++) dots += `<span class="dot ${i < done ? 'on' : ''}"></span>`;
  app.innerHTML = `<div class="wrap">${header()}
    ${!storageOK ? `<div class="note warn"><b>Дневник не сохраняется</b>Браузер не даёт хранить данные: после закрытия страницы записи пропадут. Копируйте отчёт после каждой тренировки.</div>` : ''}
    <div class="card"><div class="today"><div><h2 style="margin:0 0 4px">Сегодня</h2><b>${done} из ${rx.perDay}</b> <span class="sub">${plural(rx.perDay,'тренировки','тренировок','тренировок')}</span></div><div class="dots">${dots}</div></div></div>
    <div class="card"><h2>Текущий уровень</h2>${levelKV(rx)}
      <div class="meta">${rx.setAt ? `Назначение ${rx.specialist ? esc(rx.specialist) + ', ' : ''}${fmtDay(rx.setAt)}` : 'Стартовые параметры. Специалист TURA настроит назначение под пациента.'}${rx.auto ? ' Нагрузка растёт автоматически.' : ''}</div>
    </div>
    <button class="btn btn-p" data-a="start">Начать тренировку</button>
    ${Cam.available() ? `<button class="btn btn-s" data-a="startTest">Тест стабилизации взора<small>камера · начало и конец курса</small></button>` : ''}
    <div class="navgrid">
      <button class="navbtn" data-a="go" data-v="howto"><b>Как выполнять</b><span>Техника и смысл упражнения</span></button>

function testsCard(){
  const ts = (DB.tests || []).slice().reverse();
  if(!ts.length) return '';
  const first = DB.tests[0], last = DB.tests[DB.tests.length - 1];
  const delta = DB.tests.length > 1 && first.dir === last.dir ? `<div class="note ${last.maxVel > first.maxVel ? 'ok' : 'info'}" style="margin:0 0 10px">Было ${first.maxVel || '—'} °/с (${fmtDay(first.ts)}) → стало ${last.maxVel || '—'} °/с (${fmtDay(last.ts)})</div>` : '';
  return `<div class="card"><h2>Тест стабилизации взора<span class="beta">β</span></h2>${delta}${ts.slice(0, 8).map(x => `<div class="sess"><div class="d">${fmtDT(x.ts)}</div><span class="tag keep">${x.maxVel || '—'} °/с</span><div class="x">${L.dirShort[x.dir]} · ${x.maxBpm ? `пройден уровень ${x.maxBpm} уд/мин` : 'уровни не пройдены'}</div></div>`).join('')}</div>`;
}

function buildChart(el, o){
  if(!el) return;
  const W = 340, H = 170, ml = 30, mr = o.direct ? 50 : 14, mt = 12, mb = 26;
  const n = o.series[0].values.length, iw = W - ml - mr, ih = H - mt - mb;
  const x = i => n <= 1 ? ml + iw/2 : ml + i * iw / (n - 1);
  const y = v => mt + ih - (v - o.yMin) / (o.yMax - o.yMin) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.series.map(z => z.name).join(', '))}">`;
  o.yTicks.forEach(t => {
    s += `<line x1="${ml}" x2="${W - mr}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--grid)" stroke-width="1"/>`;
    s += `<text x="${ml - 6}" y="${y(t) + 4}" text-anchor="end" class="ax">${t}</text>`;
  });
  s += `<text x="${x(0)}" y="${H - 6}" text-anchor="${n <= 1 ? 'middle' : 'start'}" class="ax">${o.xLabels[0]}</text>`;
  if(n > 1) s += `<text x="${x(n-1)}" y="${H - 6}" text-anchor="end" class="ax">${o.xLabels[n-1]}</text>`;
  const ends = [];
  o.series.forEach(se => {
    const pts = se.values.map((v, i) => [x(i), y(v)]);
    if(n > 1) s += `<polyline fill="none" style="stroke:${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
    if(n <= 40) pts.forEach(p => s += `<circle cx="${p[0]}" cy="${p[1]}" r="4" style="fill:${se.color}" stroke="#fff" stroke-width="2"/>`);
    ends.push({name:se.name, y:pts[pts.length-1][1], x:pts[pts.length-1][0]});
  });
  if(o.direct){
    if(ends.length === 2 && Math.abs(ends[0].y - ends[1].y) < 13){
      const mid = (ends[0].y + ends[1].y) / 2;
      ends[0].y = mid - 7; ends[1].y = mid + 7;
      if(o.series[0].values[n-1] < o.series[1].values[n-1]){ ends[0].y = mid + 7; ends[1].y = mid - 7; }
    }
    ends.forEach(e => s += `<text x="${e.x + 9}" y="${e.y + 4}" class="dl">${esc(e.name)}</text>`);
  }
  s += `<line class="xh" x1="0" x2="0" y1="${mt}" y2="${mt + ih}" style="stroke:var(--ink2)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/>`;
  s += `<rect class="hit" x="${ml - 12}" y="0" width="${iw + 24}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  el.innerHTML = s;
  const svg = el.querySelector('svg'), hit = el.querySelector('.hit'), xh = el.querySelector('.xh'), tip = el.querySelector('.tip');
  const show = ev => {
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * W;
    let i = n <= 1 ? 0 : Math.round((px - ml) / (iw / (n - 1)));
    i = Math.max(0, Math.min(n - 1, i));
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('opacity', '1');
    tip.innerHTML = o.tipFmt(i); tip.hidden = false;
    const left = Math.max(60, Math.min(r.width - 60, x(i) / W * r.width));
    tip.style.left = left + 'px'; tip.style.top = '-8px'; tip.style.transform = 'translate(-50%,-100%)';
  };
  const hide = () => { xh.setAttribute('opacity', '0'); tip.hidden = true; };
  hit.addEventListener('pointermove', show);
  hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', hide);
}

function recWord(s){
  if(s.stopped) return 'остановлена';
  if(s.rec === 'up') return s.change && s.change.applied ? 'нагрузка ↑' : 'можно повысить';
  if(s.rec === 'down') return s.change && s.change.applied ? 'нагрузка ↓' : 'снизить';
  if(s.rec === 'max') return 'потолок';
  return 'без изменений';
}

function reportText(){
  const rx = DB.rx, ss = DB.sessions, out = ['TURA · VOR×1 — отчёт для специалиста'];
  if(rx.patient) out.push('Пациент: ' + rx.patient);
  out.push('Сформирован: ' + fmtDT(Date.now()));
  if(!ss.length) out.push('Тренировок пока нет.');
  else {
    const days = new Set(ss.map(s => dayKey(s.ts))).size;
    out.push(`Период: ${fmtDay(ss[0].ts)}–${fmtDay(ss[ss.length-1].ts)}; тренировок: ${ss.length}; дней с занятиями: ${days} (план: ${rx.perDay} в день)`);
    const r = ss.slice(-10);
    const avg = k => (r.reduce((a, s) => a + s[k], 0) / r.length).toFixed(1);
    const sets = r.flatMap(s => s.clarity);
    const clear = sets.length ? Math.round(sets.filter(c => c === 0).length / sets.length * 100) : 0;
    out.push(`Последние ${r.length}: головокружение в среднем ${avg('pre')} → ${avg('post')} (0–10); цель чёткая в ${clear}% подходов; остановлено: ${r.filter(s => s.stopped).length}`);
  }
  out.push(`Текущий уровень: ${L.dirShort[rx.dir].toLowerCase()}, ${rx.bpm} уд/мин, ${rx.sets} × ${durLabel(rx.setSec)}, отдых ${rx.restSec} с, фон — ${L.bg[rx.bg].toLowerCase()}, ${L.pos[rx.pos].toLowerCase()}, ${L.sym[rx.sym].toLowerCase()}, ${L.dist[rx.dist]}`);
  out.push(`Потолок: ${rx.maxBpm} уд/мин, ${durLabel(rx.maxSetSec)}; автопрогрессия: ${rx.auto ? 'вкл' : 'выкл'}`);
  const tests = DB.tests || [];
  if(tests.length){
    out.push('', 'Тест стабилизации взора (камера, экспериментально):');
    tests.slice(-5).reverse().forEach(x => out.push(`• ${fmtDT(x.ts)} — ${x.maxVel || '—'} °/с (уровень ${x.maxBpm || '—'} уд/мин, ${L.dirShort[x.dir].toLowerCase()})`));
  }
  if(ss.length){
    out.push('', 'Последние тренировки:');
    ss.slice(-10).reverse().forEach(s => out.push(`• ${fmtDT(s.ts)} — ${s.bpm} уд/мин, ${s.setsDone}/${s.setsPlanned} × ${durLabel(s.setSec)}; головокр. ${s.pre}→${s.post}; ${clarityWord(s)}; ${recWord(s)}${s.mode === 'helper' ? '; с помощником' : ''}${s.cam ? '; камера: ' + camLine(s.cam) : ''}`));
  }
  return out.join('\n');
}

/* ---------- camera (MediaPipe Face Landmarker) ---------- */
const MP_VER = '1.2.3';
const MP_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@' + MP_VER;
const MODEL_URL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
const TEST_BPM = [60, 80, 100, 120, 140, 160, 180];
const BLINK = 0.12;

function camErrText(e){
  const n = e && e.name;
  if(n === 'NotAllowedError' || n === 'SecurityError') return 'Доступ к камере запрещён. Разрешите камеру для этого сайта в настройках браузера и обновите страницу.';
  if(n === 'NotFoundError' || n === 'OverconstrainedError') return 'Фронтальная камера не найдена.';
  if(n === 'NotReadableError') return 'Камера занята другим приложением. Закройте его и попробуйте снова.';
  return 'Не удалось загрузить распознавание лица. Проверьте интернет и попробуйте снова.';
}

const Cam = {
  state:'off', err:'', video:null, stream:null, lm:null, raf:0, lastVT:-1,
  rec:null, recPaused:false, recent:[], last:null, fps:0, _fc:0, _ft:0,
  available(){
    if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) || !window.isSecureContext) return false;
    try{
      const fp = document.permissionsPolicy || document.featurePolicy;
      if(fp && fp.allowsFeature && !fp.allowsFeature('camera')) return false;
    }catch(e){}
    return true;
  },
  ensureVideo(){
    if(!this.video){
      const v = document.createElement('video');
      v.id = 'camv'; v.setAttribute('playsinline', ''); v.setAttribute('muted', ''); v.muted = true; v.autoplay = true;
      v.className = 'parked'; document.body.appendChild(v); this.video = v;
    }
    return this.video;
  },
  async start(onUpdate){
    if(this.state === 'ready' || this.state === 'loading') return;
    this.state = 'loading'; this.err = ''; onUpdate && onUpdate();
    try{
      const v = this.ensureVideo();
      this.stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:'user', width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:30}}});
      v.srcObject = this.stream;
      try{ await v.play(); }catch(e){}
      if(!this.lm){
        const mod = await import(MP_BASE + '/vision_bundle.mjs');
        const files = await mod.FilesetResolver.forVisionTasks(MP_BASE + '/wasm');
        const opts = d => ({baseOptions:{modelAssetPath:MODEL_URL, delegate:d}, runningMode:'VIDEO', numFaces:1,
          outputFacialTransformationMatrixes:true, outputFaceBlendshapes:false,
          minFaceDetectionConfidence:.5, minFacePresenceConfidence:.5, minTrackingConfidence:.5});
        try{ this.lm = await mod.FaceLandmarker.createFromOptions(files, opts('GPU')); }
        catch(e){ this.lm = await mod.FaceLandmarker.createFromOptions(files, opts('CPU')); }
      }
      this.state = 'ready'; this.loop();
    }catch(e){
      console.warn('camera', e);
      this.stop(); this.state = 'error'; this.err = camErrText(e);
    }
    onUpdate && onUpdate();
  },
  loop(){
    cancelAnimationFrame(this.raf);
    const step = () => {
      if(this.state !== 'ready') return;
      const v = this.video;
      if(v && v.readyState >= 2 && v.currentTime !== this.lastVT){
        this.lastVT = v.currentTime;
        const now = performance.now();
        let res = null;
        try{ res = this.lm.detectForVideo(v, now); }catch(e){}
        this.process(res, now / 1000, v.videoWidth, v.videoHeight);
      }
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  },
  process(res, t, W, H){
    const s = {t, face:false, ok:false, yaw:NaN, pitch:NaN, eh:NaN, ev:NaN, open:0, iod:0};
    if(res && res.faceLandmarks && res.faceLandmarks.length && W && H){
      const Lm = res.faceLandmarks[0];
      const P = i => ({x:Lm[i].x * W, y:Lm[i].y * H});
      s.face = true;
      const mt = res.facialTransformationMatrixes && res.facialTransformationMatrixes[0];
      const m = mt && (mt.data || mt);
      if(m && m.length >= 11){
        const fx = m[8], fy = m[9], fz = m[10];
        s.yaw = Math.atan2(fx, fz) * 180 / Math.PI;
        s.pitch = Math.atan2(-fy, Math.hypot(fx, fz)) * 180 / Math.PI;
      }
      if(Lm.length >= 478){
        // глаз: угол A (левый по изображению) → B (правый), веки U/D, центр радужки C
        const eye = (a, b, u, d, c) => {
          const A = P(a), B = P(b), U = P(u), D = P(d), C = P(c);
          const ax = B.x - A.x, ay = B.y - A.y, w2 = ax*ax + ay*ay || 1;
          const th = ((C.x - A.x) * ax + (C.y - A.y) * ay) / w2 - 0.5;
          const vx = D.x - U.x, vy = D.y - U.y, h2 = vx*vx + vy*vy || 1;
          const tv = ((C.x - U.x) * vx + (C.y - U.y) * vy) / h2 - 0.5;
          return {th, tv, open:Math.sqrt(h2 / w2)};
        };
        const r = eye(33, 133, 159, 145, 468), l = eye(362, 263, 386, 374, 473);
        s.eh = (r.th + l.th) / 2; s.ev = (r.tv + l.tv) / 2; s.open = (r.open + l.open) / 2;
        const i1 = P(468), i2 = P(473);
        s.iod = Math.hypot(i1.x - i2.x, i1.y - i2.y) / Math.min(W, H);
      }
      s.ok = isFinite(s.yaw) && isFinite(s.eh) && s.open > BLINK;
    }
    this.last = s;
    this.recent.push(s);
    while(this.recent.length && t - this.recent[0].t > 1.5) this.recent.shift();
    this._fc++; if(t - this._ft >= 1){ this.fps = this._fc / (t - this._ft || 1); this._fc = 0; this._ft = t; }
    if(this.rec && !this.recPaused){
      const R = this.rec;
      R.t.push(t); R.yaw.push(s.yaw); R.pitch.push(s.pitch); R.eh.push(s.eh); R.ev.push(s.ev); R.ok.push(s.ok);
    }
  },
  liveVel(dir){
    const a = this.recent.filter(s => s.face && isFinite(dir === 'v' ? s.pitch : s.yaw));
    if(a.length < 6) return null;
    let mx = 0;
    for(let i = 2; i < a.length - 2; i++){
      const dt = a[i+2].t - a[i-2].t; if(dt <= 0 || dt > .4) continue;
      const v = Math.abs(((dir === 'v' ? a[i+2].pitch : a[i+2].yaw) - (dir === 'v' ? a[i-2].pitch : a[i-2].yaw)) / dt);
      if(v > mx) mx = v;
    }
    return mx;
  },
  startRec(){ this.rec = {t:[], yaw:[], pitch:[], eh:[], ev:[], ok:[]}; this.recPaused = false; },
  stopRec(){ const r = this.rec; this.rec = null; return r; },
  stop(){
    cancelAnimationFrame(this.raf); this.raf = 0;
    if(this.stream){ this.stream.getTracks().forEach(tr => tr.stop()); this.stream = null; }
    if(this.video){ this.video.srcObject = null; }
    if(this.state !== 'error') this.state = 'off';
    this.last = null; this.recent = []; this.rec = null; this.lastVT = -1;
  }
};
function parkVideo(){
  const v = Cam.video;
  if(v && v.parentNode !== document.body){ document.body.appendChild(v); }
  if(v){ v.className = 'parked'; }
}
function mountVideo(slot){
  const v = Cam.video; if(!v || !slot) return;
  slot.insertBefore(v, slot.firstChild); v.className = 'preview';
  try{ const p = v.play(); if(p && p.catch) p.catch(() => {}); }catch(e){}
}

/* ---------- signal analysis ---------- */
const median = a => { if(!a.length) return NaN; const b = [...a].sort((x, y) => x - y), n = b.length; return n % 2 ? b[(n-1)/2] : (b[n/2-1] + b[n/2]) / 2; };
const pct = (a, p) => { if(!a.length) return NaN; const b = [...a].sort((x, y) => x - y); return b[Math.min(b.length - 1, Math.max(0, Math.round(p / 100 * (b.length - 1))))]; };
function smooth(a, w){
  const h = Math.floor(w / 2), out = new Array(a.length);
  for(let i = 0; i < a.length; i++){ let s = 0, n = 0; for(let j = Math.max(0, i - h); j <= Math.min(a.length - 1, i + h); j++){ s += a[j]; n++; } out[i] = s / n; }
  return out;
}
function linreg(x, y){
  const n = x.length; let mx = 0, my = 0;
  for(let i = 0; i < n; i++){ mx += x[i]; my += y[i]; }
  mx /= n; my /= n;
  let sxx = 0, syy = 0, sxy = 0;
  for(let i = 0; i < n; i++){ const dx = x[i] - mx, dy = y[i] - my; sxx += dx*dx; syy += dy*dy; sxy += dx*dy; }
  return {slope: sxy / (sxx || 1), r2: (sxy*sxy) / ((sxx*syy) || 1)};
}
function sigs(rec, dir){ return dir === 'v' ? {H:rec.pitch, E:rec.ev} : {H:rec.yaw, E:rec.eh}; }

function calibrate(rec, dir){
  if(!rec || rec.t.length < 30) return {ok:false, reason:'Камера не получила изображение лица.'};
  const {H, E} = sigs(rec, dir), hs = [], es = [];
  for(let i = 0; i < rec.t.length; i++) if(rec.ok[i] && isFinite(H[i]) && isFinite(E[i])){ hs.push(H[i]); es.push(E[i]); }
  const validFrac = hs.length / rec.t.length;
  if(hs.length < 60 || validFrac < .6) return {ok:false, validFrac, reason:'Лицо было плохо видно. Поставьте телефон на уровне глаз, включите свет перед собой.'};
  const range = pct(hs, 95) - pct(hs, 5);
  if(range < 12) return {ok:false, range, reason:`Повороты были слишком маленькими (${Math.round(range)}°). Поворачивайте голову примерно на 20° в каждую сторону.`};
  const {slope:d, r2} = linreg(hs, es);   // глаз = c + d·голова
  const k = -1 / d;
  if(r2 < .45 || !isFinite(k) || Math.abs(k) < 30 || Math.abs(k) > 900)
    return {ok:false, r2, range, reason:'Не удалось надёжно отследить глаза. Добавьте света на лицо, уберите блики с очков и держите телефон неподвижно.'};
  return {ok:true, k, d, r2, range, validFrac};
}

function deriv(a, ts){
  return a.map((_, i) => { const lo = Math.max(0, i - 2), hi = Math.min(a.length - 1, i + 2); return (a[hi] - a[lo]) / ((ts[hi] - ts[lo]) || 1); });
}
function analyze(rec, calib, skip, dir){
  if(!rec || rec.t.length < 20) return {valid:false};
  const {H, E} = sigs(rec, dir), t0 = rec.t[0] + skip;
  const idx = []; let total = 0;
  for(let i = 0; i < rec.t.length; i++){ if(rec.t[i] < t0) continue; total++; if(rec.ok[i] && isFinite(H[i]) && (!calib || isFinite(E[i]))) idx.push(i); }
  const dur = rec.t[rec.t.length - 1] - t0, fps = total / Math.max(dur, .001), validFrac = idx.length / Math.max(total, 1);
  if(idx.length < 30 || validFrac < .5) return {valid:false, validFrac, fps};
  // разрыв сегмента: пропуск кадров (моргание, лицо потеряно)
  const dts = []; for(let j = 1; j < idx.length; j++) dts.push(rec.t[idx[j]] - rec.t[idx[j-1]]);
  const gap = Math.max(.12, 2.5 * median(dts));
  const segs = []; let cur = [idx[0]];
  for(let j = 1; j < idx.length; j++){ if(rec.t[idx[j]] - rec.t[idx[j-1]] > gap){ segs.push(cur); cur = []; } cur.push(idx[j]); }
  segs.push(cur);
  const peaks = [], amps = [];
  const T = [], HR = [], HD = [], HV = [], GR = [], EV = [], SEG = [];
  const d3 = (a, ts) => a.map((_, j) => { const lo = Math.max(0, j - 1), hi = Math.min(a.length - 1, j + 1); return (a[hi] - a[lo]) / ((ts[hi] - ts[lo]) || 1); });
  segs.forEach((sg, si) => {
    if(sg.length < 9) return;
    const ts = sg.map(i => rec.t[i]), hs = smooth(sg.map(i => H[i]), 5), vel = deriv(hs, ts);
    let sign = 0, start = 0, pk = 0, lo = Infinity, hi = -Infinity;
    for(let i = 0; i < vel.length; i++){
      const v = vel[i], sg2 = v > 15 ? 1 : v < -15 ? -1 : 0;
      if(sg2 !== 0 && sg2 !== sign){
        if(sign !== 0 && ts[i] - ts[start] > .15){ peaks.push(pk); amps.push(hi - lo); }
        sign = sg2; start = i; pk = 0; lo = Infinity; hi = -Infinity;
      }
      pk = Math.max(pk, Math.abs(v)); lo = Math.min(lo, hs[i]); hi = Math.max(hi, hs[i]);
    }
    if(sign !== 0 && ts[ts.length - 1] - ts[start] > .15){ peaks.push(pk); amps.push(hi - lo); }
    let ed = null, ev = null, hv3 = null;
    if(calib){ ed = sg.map(i => calib.k * E[i]); ev = d3(ed, ts); hv3 = d3(sg.map(i => H[i]), ts); }
    sg.forEach((i, j) => {
      T.push(rec.t[i] - t0); HR.push(H[i]); HD.push(hs[j]); HV.push(calib ? hv3[j] : vel[j]); SEG.push(si);
      if(calib){ GR.push(H[i] + ed[j]); EV.push(ev[j]); }
    });
  });
  const out = {valid:true, fps, validFrac, vel:median(peaks), amp:median(amps), turns:peaks.length, gaze:null, trace:null};
  if(!isFinite(out.vel)) out.vel = 0;
  if(!isFinite(out.amp)) out.amp = 0;
  const hMed = median(HR);
  const n = T.length;
  if(calib && n > 20){
    // ошибка взгляда относительно скользящей медианы ±1 с (убирает медленный дрейф телефона/корпуса)
    const err = new Array(n);
    for(let i = 0; i < n; i++){
      const w = [];
      for(let j = i; j >= 0 && T[i] - T[j] <= 1; j--) w.push(GR[j]);
      for(let j = i + 1; j < n && T[j] - T[i] <= 1; j++) w.push(GR[j]);
      err[i] = GR[i] - median(w);
    }
    // поправочные саккады: быстрый скачок ошибки к нулю
    const sac = new Uint8Array(n); let sacc = 0;
    for(let i = 3; i < n - 3; i++){
      if(SEG[i-3] !== SEG[i+2] || T[i+2] - T[i-3] > .4 || T[i] - T[i-1] > .1) continue;
      const pre = (err[i-3] + err[i-2] + err[i-1]) / 3, post = (err[i] + err[i+1] + err[i+2]) / 3, jump = Math.abs(post - pre);
      if(jump >= 3.5 && Math.abs(post) < Math.abs(pre) - 1.5 && Math.abs(err[i] - err[i-1]) >= .5 * jump){
        sacc++; for(let j = Math.max(0, i - 2); j <= Math.min(n - 1, i + 2); j++) sac[j] = 1; i += 4;
      }
    }
    const es = smooth(err, 3);
    const stab = es.filter(v => Math.abs(v) <= 4).length / n;
    const rms = Math.sqrt(es.reduce((s2, v) => s2 + v*v, 0) / n);
    // gain по скоростям медленной фазы (без саккад, при скорости головы ≥ 30°/с)
    let sxy = 0, sxx = 0, m = 0;
    for(let i = 0; i < n; i++){ if(sac[i] || Math.abs(HV[i]) < 30 || !isFinite(EV[i])) continue; sxy += EV[i] * HV[i]; sxx += HV[i] * HV[i]; m++; }
    const gain = m > 15 ? -sxy / sxx : NaN;
    out.gaze = {stab, rms, sacc, gain};
    const stepN = Math.max(1, Math.ceil(n / 160)), tr = {t:[], head:[], gaze:[]};
    for(let i = 0; i < n; i += stepN){ tr.t.push(T[i]); tr.head.push(HD[i] - hMed); tr.gaze.push(es[i]); }
    out.trace = tr;
  } else {
    const stepN = Math.max(1, Math.ceil(n / 160)), tr = {t:[], head:[], gaze:null};
    for(let i = 0; i < n; i += stepN){ tr.t.push(T[i]); tr.head.push(HD[i] - hMed); }
    out.trace = tr;
  }
  return out;
}
const levelPass = a => !!(a && a.valid && a.amp >= 20 && a.gaze && a.gaze.stab >= .7);

function camMetricsHTML(a, compact){
  if(!a) return '';
  if(!a.valid) return `<div class="note warn"><b>Камера: мало данных</b>Лицо было видно ${Math.round((a.validFrac || 0) * 100)}% времени. Проверьте свет и положение телефона.</div>`;
  const g = a.gaze;
  return `<div class="kv">
    <div><small>Скорость головы</small><b>${Math.round(a.vel)}°/с</b></div>
    <div><small>Размах поворотов</small><b>${Math.round(a.amp)}°</b></div>
    ${g ? `<div><small>Взгляд на цели<span class="beta">β</span></small><b>${Math.round(g.stab * 100)}%</b></div>
    <div><small>Поправки взгляда<span class="beta">β</span></small><b>${g.sacc}</b></div>
    ${compact ? '' : `<div><small>Компенсация, gain<span class="beta">β</span></small><b>${isFinite(g.gain) ? g.gain.toFixed(2) : '—'}</b></div>`}` : ''}
    ${compact ? '' : `<div><small>Качество записи</small><b>${Math.round(a.validFrac * 100)}% · ${Math.round(a.fps)} к/с</b></div>`}
  </div>${a.amp < 15 ? `<div class="note warn" style="margin:10px 0 0">Повороты маленькие (${Math.round(a.amp)}°). Поворачивайте голову шире — примерно на 20° в каждую сторону.</div>` : ''}`;
}
function traceChart(id, a){
  const el = document.getElementById(id);
  if(!el || !a || !a.trace || a.trace.t.length < 5) return;
  const tr = a.trace, all = tr.head.concat(tr.gaze || []).map(Math.abs);
  const m = Math.max(10, Math.ceil(Math.max(...all) / 10) * 10);
  const series = [{name:'голова', color:'var(--s1)', values:tr.head.map(v => +v.toFixed(1))}];
  if(tr.gaze) series.push({name:'взгляд', color:'var(--s2)', values:tr.gaze.map(v => +v.toFixed(1))});
  buildChart(el, {series, yMin:-m, yMax:m, yTicks:[-m, 0, m], xLabels:tr.t.map(v => Math.round(v) + ' с'), direct:true,
    tipFmt:i => `<b>${tr.t[i].toFixed(1)} с</b><br>голова ${tr.head[i].toFixed(0)}°${tr.gaze ? ` · взгляд ${tr.gaze[i].toFixed(1)}°` : ''}`});
}

/* ---------- session flow ---------- */
function startSession(kind = 'train'){
  if(!DB.safetyAck){ afterSafety = kind; view = 'safety'; render(); return; }
  const rx = DB.rx;
  S = {kind, step:'check', setIdx:0, levelIdx:0, clarity:[], blur:[], camSets:[], levels:[], pre:null, post:null, stopped:false,
       rx:{dir:rx.dir, bpm:rx.bpm, setSec:rx.setSec, sets:rx.sets, restSec:rx.restSec, bg:kind === 'test' ? 'plain' : rx.bg, pos:rx.pos, dist:rx.dist, sym:rx.sym, size:rx.size},
       cam:kind === 'test' ? true : (DB.camOn && Cam.available()), calib:null, cur:null, timers:[], run:null, result:null};
  render();
}

function ratingGrid(){
  let b = '';
  for(let i = 0; i <= 10; i++) b += `<button data-a="rate" data-v="${i}">${i}</button>`;
  return `<div class="rate">${b}</div><div class="anchors"><span>0 — нет</span><span>5 — умеренное</span><span>10 — сильнейшее</span></div>`;
}

let camTick = 0;
function camStatusText(){
  if(Cam.state === 'loading') return {ok:false, t:'Загружаем распознавание лица… В первый раз это ~15 МБ и до минуты.'};
  if(Cam.state === 'error') return {ok:false, t:Cam.err, err:true};
  if(Cam.state !== 'ready') return {ok:false, t:'Включаем камеру…'};
  const s = Cam.last;
  if(!s || !s.face) return {ok:false, t:'Лицо не найдено. Держите телефон на уровне глаз, лицо целиком в кадре.'};
  if(s.iod < .09) return {ok:false, t:'Слишком далеко — поднесите телефон ближе.'};
  if(s.iod > .42) return {ok:false, t:'Слишком близко — отодвиньте телефон.'};
  if(s.open < BLINK) return {ok:false, t:'Глаза не видны — откройте глаза, уберите блики с очков.'};
  return {ok:true, t:'Лицо найдено ✓ Можно начинать калибровку.'};
}
function startCamTick(){
  clearInterval(camTick);
  camTick = setInterval(() => {
    if(!S || S.step !== 'camcheck'){ clearInterval(camTick); return; }
    const st = camStatusText(), el = document.getElementById('camStat'), b = document.getElementById('calibBtn');
    if(el){ el.textContent = st.t; el.className = 'note ' + (st.ok ? 'ok' : st.err ? 'danger' : 'info'); }
    if(b) b.disabled = !st.ok;
    const slot = document.getElementById('camslot');
    if(slot && Cam.video && Cam.state === 'ready' && Cam.video.parentNode !== slot) mountVideo(slot);
  }, 300);
}

function renderSession(){
  const r = S.rx, one = L.one[r.sym], acc = L.acc[r.sym], test = S.kind === 'test';
  const cancel = `<button class="btn btn-s" data-a="cancelSession">Отменить</button>`;
  switch(S.step){
    case 'check':
      app.innerHTML = `<div class="wrap">${header()}
        <h1>${test ? 'Перед тестом' : 'Перед тренировкой'}</h1>
        <div class="card"><h2>Нет ли сегодня нового симптома?</h2>${RED_FLAGS}</div>
        <button class="btn btn-p" data-a="flagNone">Ничего нового — продолжить</button>
        <button class="btn btn-d" data-a="flagYes">Есть новый симптом</button>
        ${cancel}</div>`; break;
    case 'alarm':
      app.innerHTML = `<div class="wrap">${header()}
        <div class="note danger"><b>Не выполняйте упражнение сегодня</b>Если симптом появился внезапно — звоните 103 (или 112). В остальных случаях сообщите специалисту TURA.</div>
        <button class="btn btn-s" data-a="cancelSession">На главную</button></div>`; break;
    case 'pre':
      app.innerHTML = `<div class="wrap">${header()}
        <h1>Головокружение сейчас</h1><p>Оцените до упражнения: 0 — совсем нет, 10 — сильнейшее.</p>
        <div class="card">${ratingGrid()}</div>${cancel}</div>`; break;

/* ---------- metronome ---------- */
const Metro = {
  ctx:null, timer:null, rafId:0, nextBeat:0, beatIdx:0, interval:1, onBeat:null, queue:[],
  async init(){
    try{
      if(!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) this.ctx = new AC(); }
      if(this.ctx && this.ctx.state === 'suspended') await this.ctx.resume();
    }catch(e){ this.ctx = null; }
  },
  now(){ return this.ctx && this.ctx.state === 'running' ? this.ctx.currentTime : performance.now() / 1000; },
  beep(t, freq, dur = 0.07, vol = 0.3){
    if(!this.ctx || this.ctx.state !== 'running') return;
    try{
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.03);
    }catch(e){}
  },
  beepNow(freq, dur, vol){ if(this.ctx && this.ctx.state === 'running') this.beep(this.ctx.currentTime + 0.01, freq, dur, vol); },
  start(bpm, onBeat){
    this.stop();
    this.interval = 60 / bpm; this.onBeat = onBeat; this.queue = [];
    this.nextBeat = this.now() + 0.12;
    this.timer = setInterval(() => this.tick(), 20);
    const loop = () => {
      if(!this.timer) return;
      const n = this.now();
      while(this.queue.length && this.queue[0].t <= n){ const b = this.queue.shift(); if(this.onBeat) this.onBeat(b.i); }
      this.rafId = requestAnimationFrame(loop);
    };
    this.rafId = requestAnimationFrame(loop);
  },
  tick(){
    const ahead = 0.12;
    while(this.nextBeat < this.now() + ahead){
      this.beep(this.nextBeat, this.beatIdx % 2 ? 620 : 880);
      this.queue.push({t:this.nextBeat, i:this.beatIdx});
      this.nextBeat += this.interval; this.beatIdx++;
    }
  },
  stop(){ clearInterval(this.timer); this.timer = null; cancelAnimationFrame(this.rafId); this.queue = []; }
};

let wakeLock = null;
async function keepAwake(){ try{ if('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
function releaseAwake(){ try{ if(wakeLock){ wakeLock.release(); } }catch(e){} wakeLock = null; }
function enterFS(){ try{ const el = document.documentElement; if(!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {}); }catch(e){} }
function exitFS(){ try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {}); }catch(e){} }

function pickSym(prev){
  const set = SYMS[S.rx.sym]; let s;
  do { s = set[Math.floor(Math.random() * set.length)]; } while(set.length > 1 && s === prev);
  return s;
}
function clearTimers(){ (S && S.timers || []).forEach(t => clearTimeout(t)); if(S) S.timers = []; }

const PHASE = {
  set:   () => ({kind:'set', bpm:S.rx.bpm, dur:S.rx.setSec, title:`Подход ${S.setIdx + 1} из ${S.rx.sets}`}),
  calib: () => ({kind:'calib', bpm:40, dur:12, title:'Калибровка'}),
  level: () => ({kind:'level', bpm:TEST_BPM[S.levelIdx], dur:8, title:`Тест · уровень ${S.levelIdx + 1} из ${TEST_BPM.length}`})
};
async function startPhase(kind){
  clearTimers(); clearInterval(camTick);
  if(Cam.rec) Cam.stopRec();
  S.cur = PHASE[kind]();
  await Metro.init();
  enterFS(); keepAwake();
  S.step = 'count'; S.run = null;
  render();
  let c = 3;
  Metro.beepNow(520, .12, .3);
  const step = () => {
    c--;
    const el = document.getElementById('cnt');
    if(c > 0){ if(el) el.textContent = c; Metro.beepNow(520, .12, .3); S.timers.push(setTimeout(step, 1000)); }
    else { Metro.beepNow(990, .2, .35); startRun(); }
  };
  S.timers.push(setTimeout(step, 1000));
}

function startRun(){
  S.step = 'run';
  S.run = {elapsed:0, last:performance.now(), blur:0, sym:pickSym(), nextSym:2.5 + Math.random() * 2, raf:0, camT:0};
  if(S.cam && Cam.state === 'ready') Cam.startRec();
  render();
  S.timers.push(setTimeout(() => { const h = document.getElementById('exHint'); if(h) h.classList.add('gone'); }, 5000));
  runMetro();
  loopRun();
}
function runMetro(){
  Metro.beatIdx = 0;
  Metro.start(S.cur.bpm, i => {
    const a = document.getElementById('eA'), b = document.getElementById('eB'), g = document.getElementById('headG');
    const first = i % 2 === 0;
    if(a && b){
      if(S.rx.dir === 'h'){ b.classList.toggle('on', first); a.classList.toggle('on', !first); }
      else { a.classList.toggle('on', first); b.classList.toggle('on', !first); }
    }
    if(g) g.style.transform = `rotate(${first ? 28 : -28}deg)`;
  });
}
function loopRun(){
  const R = S && S.run;
  if(!R || S.step !== 'run') return;
  const now = performance.now();
  R.elapsed += (now - R.last) / 1000; R.last = now;
  const left = S.cur.dur - R.elapsed;
  const t = document.getElementById('exT'), bar = document.getElementById('exBar');
  if(t) t.textContent = fmtSec(left);
  if(bar) bar.style.width = Math.min(100, R.elapsed / S.cur.dur * 100) + '%';
  if(R.elapsed >= R.nextSym){
    R.sym = pickSym(R.sym); R.nextSym = R.elapsed + 2.5 + Math.random() * 2;
    const el = document.getElementById('sym'); if(el) el.textContent = R.sym;
  }
  if(S.cam && now - R.camT > 250){
    R.camT = now;
    const dot = document.getElementById('camDot'), tx = document.getElementById('camTxt');
    if(dot){
      const ok = Cam.last && Cam.last.face && (performance.now() / 1000 - Cam.last.t) < .6;
      dot.className = ok ? 'ok' : 'bad';
      const v = ok ? Cam.liveVel(S.rx.dir) : null;
      if(tx) tx.textContent = ok ? (v != null ? Math.round(v) + '°/с' : 'лицо ✓') : 'лицо не видно';
    }
  }
  if(left <= 0){ endPhase(); return; }
  R.raf = requestAnimationFrame(loopRun);
}
function pauseRun(){
  if(!S || S.step !== 'run') return;
  Metro.stop(); cancelAnimationFrame(S.run.raf);
  Cam.recPaused = true;
  S.step = 'pause'; render();
}
function resumeRun(){
  if(S.cur.kind === 'calib'){ startPhase('calib'); return; }
  S.step = 'run'; S.run.last = performance.now(); Cam.recPaused = false;
  render(); runMetro(); loopRun();
}
function endPhase(){
  Metro.stop(); cancelAnimationFrame(S.run.raf);
  Metro.beepNow(990, .12, .3); setTimeout(() => Metro.beepNow(990, .25, .3), 180);
  const rec = Cam.rec ? Cam.stopRec() : null, k = S.cur.kind, dir = S.rx.dir;
  if(k === 'set'){
    S.blur.push(S.run.blur);
    S.camSets.push(S.cam && rec ? analyze(rec, S.calib && S.calib.ok ? S.calib : null, 1, dir) : null);
    S.step = 'clarity'; render();
  } else if(k === 'calib'){
    S.calib = calibrate(rec, dir); exitFS();
    S.step = 'calibDone'; render();
  } else if(k === 'level'){
    const a = analyze(rec, S.calib, 1.5, dir), pass = levelPass(a);
    S.levels.push({bpm:S.cur.bpm, a, pass});
    if(pass && S.levelIdx + 1 < TEST_BPM.length){ S.levelIdx++; startPhase('level'); }
    else finishTest(pass ? 'done' : (a && a.valid && a.amp < 20 ? 'small' : a && a.valid ? 'gaze' : 'nodata'));
  }
}
function afterClarity(v){
  S.clarity.push(v);
  if(S.setIdx + 1 < S.rx.sets){
    S.step = 'rest'; S.restLeft = S.rx.restSec; render();
    const tick = () => {
      if(!S || S.step !== 'rest') return;
      S.restLeft--;
      const el = document.getElementById('restC'); if(el) el.textContent = fmtSec(S.restLeft);
      if(S.restLeft <= 0){ Metro.beepNow(880, .15, .3); const b = document.getElementById('nextBtn'); if(b) b.textContent = 'Готово — ' + b.textContent.charAt(0).toLowerCase() + b.textContent.slice(1); return; }
      S.timers.push(setTimeout(tick, 1000));
    };
    S.timers.push(setTimeout(tick, 1000));
  } else { S.step = 'post'; exitFS(); releaseAwake(); Cam.stop(); render(); }
}

/* ---------- assessment test ---------- */
function finishTest(reason){
  Metro.stop(); clearTimers(); exitFS(); releaseAwake(); Cam.stop();
  const passed = S.levels.filter(l => l.pass);
  const best = passed.length ? passed[passed.length - 1] : null;
  const prev = DB.tests.filter(x => x.dir === S.rx.dir).slice(-1)[0] || null;
  const res = {ts:Date.now(), dir:S.rx.dir, maxVel:best ? Math.round(best.a.vel) : 0, maxBpm:best ? best.bpm : 0, reason:S.stopped ? 'stopped' : reason,
    calibR2:S.calib ? +(S.calib.r2 || 0).toFixed(2) : null,
    levels:S.levels.map(l => ({bpm:l.bpm, pass:l.pass, vel:l.a && l.a.valid ? Math.round(l.a.vel) : null, amp:l.a && l.a.valid ? Math.round(l.a.amp) : null, stab:l.a && l.a.gaze ? Math.round(l.a.gaze.stab * 100) : null}))};
  if(S.levels.length){ DB.tests.push(res); save(); }
  S.result = {test:res, prev};
  S.step = 'testResult'; render();
}
function renderTestResult(){
  const {test, prev} = S.result;
  const first = !test.maxBpm;
  const why = {done:'Пройдены все уровни теста.', gaze:first ? 'Уже на первом уровне взгляд не удерживался на цели.' : 'На следующем уровне взгляд перестал удерживаться на цели.', small:first ? 'Повороты были слишком маленькими (меньше 20°) — поворачивайте голову шире.' : 'На следующем уровне повороты стали слишком маленькими (меньше 20°).', nodata:'Камера потеряла лицо — уровень не засчитан. Проверьте свет и положение телефона.', stopped:'Тест остановлен по самочувствию.', user:'Тест остановлен.'}[test.reason] || '';
  const rows = test.levels.map(l => `<div class="sess"><div class="d">${l.bpm} уд/мин</div><span class="tag ${l.pass ? 'up' : 'down'}">${l.pass ? 'пройден' : 'не пройден'}</span>
    <div class="x">${l.vel != null ? `голова ${l.vel}°/с · размах ${l.amp}°` : 'нет данных'}${l.stab != null ? ` · взгляд на цели ${l.stab}%` : ''}</div></div>`).join('');
  app.innerHTML = `<div class="wrap">${header()}
    <h1>Результат теста</h1>
    <div class="card" style="text-align:center">
      <div class="sub" style="font-weight:700">Скорость головы со стабильным взглядом</div>
      <div style="font-size:56px;font-weight:800;line-height:1.1;margin:6px 0">${test.maxVel || '—'}<span style="font-size:22px"> °/с</span></div>
      <div class="sub">${test.maxBpm ? `уровень ${test.maxBpm} уд/мин · ${L.dirShort[test.dir].toLowerCase()}` : 'не пройден ни один уровень'}</div>
      ${prev ? `<div class="note ${test.maxVel > prev.maxVel ? 'ok' : 'info'}" style="margin:14px 0 0">Прошлый тест ${fmtDay(prev.ts)}: ${prev.maxVel || '—'} °/с${test.maxVel && prev.maxVel ? ` → сейчас ${test.maxVel > prev.maxVel ? '+' : ''}${test.maxVel - prev.maxVel} °/с` : ''}</div>` : ''}
    </div>
    ${why ? `<div class="note info">${why}</div>` : ''}
    <div class="card"><h2>Уровни</h2>${rows || '<p style="margin:0">Нет данных.</p>'}</div>
    <div class="note warn"><b>Экспериментальная оценка</b>Сравнивайте результаты одного пациента между собой (начало и конец курса), а не с нормами. Условия теста — свет, расстояние, положение — должны быть одинаковыми.</div>
    <button class="btn btn-p" data-a="doneSession">Готово</button></div>`;
}

/* ---------- progression ---------- */
const worst = s => s.clarity.length ? Math.max(...s.clarity) : -1;
const clarityWord = s => s.clarity.length ? L.clarity[worst(s)] : 'подходы не завершены';
const ampOK = s => !s.cam || !s.cam.n || s.cam.amp >= 15;
const isGood = s => !s.stopped && s.setsDone === s.setsPlanned && s.post < 7 && (s.post - s.pre) <= 2 && worst(s) === 0 && ampOK(s);

function recommend(cur){
  const rx = DB.rx, d = cur.post - cur.pre, w = worst(cur), why = [];
  if(cur.stopped) why.push('тренировку остановили из-за самочувствия');
  if(cur.post >= 7) why.push('после занятия сильное головокружение');
  if(d >= 4) why.push(`головокружение усилилось на ${balls(d)}`);
  if(w === 2) why.push(`${L.one[cur.sym]} часто расплывалась`);
  if(why.length) return {code:'down', why};
  if(!ampOK(cur)) return {code:'keep', sub:'small'};
  if(isGood(cur)){
    const prev = DB.sessions[DB.sessions.length - 1];
    const sameLevel = prev && prev.bpm === cur.bpm && prev.setSec === cur.setSec && prev.dir === cur.dir && prev.bg === cur.bg && prev.pos === cur.pos;
    if(sameLevel && isGood(prev)){
      if(rx.bpm >= rx.maxBpm && rx.setSec >= rx.maxSetSec) return {code:'max'};
      if(todaySessions().some(s => s.rec === 'up' && s.change && s.change.applied)) return {code:'keep', sub:'day'};
      return {code:'up'};
    }
    return {code:'keep', sub:'first'};
  }
  if(cur.setsDone < cur.setsPlanned) return {code:'keep', sub:'short'};
  return {code:'keep', sub:'adapt'};
}
function planChange(code){
  const rx = DB.rx, from = {bpm:rx.bpm, setSec:rx.setSec}, to = {...from};
  let step = rx.lastStep;
  if(code === 'up'){
    const canB = rx.bpm < rx.maxBpm, canD = rx.setSec < rx.maxSetSec;
    if(canB && (!canD || rx.lastStep !== 'bpm')){ to.bpm = Math.min(rx.maxBpm, rx.bpm + 10); step = 'bpm'; }
    else { to.setSec = Math.min(rx.maxSetSec, rx.setSec + 15); step = 'dur'; }
  } else if(code === 'down'){
    if(rx.bpm > 40) to.bpm = Math.max(40, rx.bpm - 10); else to.setSec = Math.max(15, rx.setSec - 15);
  }
  return {from, to, step, prevStep:rx.lastStep};
}
function camAggregate(){
  const v = S.camSets.filter(a => a && a.valid);
  if(!v.length) return S.cam ? {n:0} : null;
  const g = v.filter(a => a.gaze);
  const agg = {n:v.length, vel:Math.round(median(v.map(a => a.vel))), amp:Math.round(median(v.map(a => a.amp)))};
  if(g.length){
    agg.stab = Math.round(g.reduce((s, a) => s + a.gaze.stab, 0) / g.length * 100);
    agg.sacc = g.reduce((s, a) => s + a.gaze.sacc, 0);
    const gn = g.map(a => a.gaze.gain).filter(isFinite);
    if(gn.length) agg.gain = +(gn.reduce((s, x) => s + x, 0) / gn.length).toFixed(2);
  }
  return agg;
}

function finishSession(){
  const r = S.rx;
  const cur = {ts:Date.now(), dir:r.dir, bpm:r.bpm, setSec:r.setSec, setsPlanned:r.sets, setsDone:S.clarity.length,
    bg:r.bg, pos:r.pos, dist:r.dist, sym:r.sym, mode:DB.mode, pre:S.pre, post:S.post,
    clarity:S.clarity.slice(), blur:S.blur.slice(), stopped:S.stopped, cam:camAggregate()};
  const rec = recommend(cur);
  cur.rec = rec.code;
  if(rec.code === 'up' || rec.code === 'down'){
    const ch = planChange(rec.code);
    cur.change = {from:ch.from, to:ch.to, prevStep:ch.prevStep, applied:false};
    if(DB.rx.auto){
      DB.rx.bpm = ch.to.bpm; DB.rx.setSec = ch.to.setSec;
      if(rec.code === 'up') DB.rx.lastStep = ch.step;
      cur.change.applied = true;
    }
  }
  DB.sessions.push(cur); save();
  S.result = {cur, rec};
  S.step = 'summary'; render();
}

function changeText(ch){
  const parts = [];
  if(ch.to.bpm !== ch.from.bpm) parts.push(`темп ${ch.from.bpm} → ${ch.to.bpm} уд/мин`);
  if(ch.to.setSec !== ch.from.setSec) parts.push(`подход ${durLabel(ch.from.setSec)} → ${durLabel(ch.to.setSec)}`);
  return parts.join(', ');
}
function camLine(c){
  if(!c) return '';
  if(!c.n) return 'камера: мало данных';
  return `голова ${c.vel}°/с, размах ${c.amp}°` + (c.stab != null ? `, взгляд на цели ${c.stab}%, поправок ${c.sacc}` : '') + (c.gain != null ? `, gain ${c.gain}` : '');
}

function renderSummary(){
  const {cur, rec} = S.result, d = cur.post - cur.pre;
  let box = '';
  const ch = cur.change;
  if(rec.code === 'up'){
    box = `<div class="note ok"><b>Отлично — два хороших результата подряд</b>${ch.applied ? `Со следующей тренировки: ${changeText(ch)}.` : `Рекомендация для специалиста: ${changeText(ch)}.`}</div>`;
  } else if(rec.code === 'down'){
    box = `<div class="note warn"><b>Нагрузка была великовата</b>${rec.why.join('; ')}. ${ch.applied ? `Немного облегчаем: ${changeText(ch)}.` : `Рекомендация для специалиста: ${changeText(ch)}.`}</div>`;
  } else if(rec.code === 'max'){
    box = `<div class="note info"><b>Достигнут потолок назначения</b>Покажите дневник специалисту TURA — он решит, как усложнить упражнение: фон, положение стоя или вертикальные движения.</div>`;
  } else {
    const t = {first:'Хороший результат. Если следующая тренировка пройдёт так же — нагрузка вырастет.',
               day:'Хороший результат. Сегодня нагрузку уже повышали — следующий шаг не раньше завтра.',
               short:'Выполнены не все подходы — уровень оставляем прежним.',
               small:`Камера показала маленькие повороты головы (${cur.cam ? cur.cam.amp : '—'}°). Поворачивайте шире — примерно на 20° в каждую сторону; тогда нагрузку можно будет повышать.`,
               adapt:'Оставляем текущий уровень: организм ещё привыкает. Это нормальная часть процесса.'}[rec.sub];
    box = `<div class="note info"><b>Уровень без изменений</b>${t}</div>`;
  }
  const warn = (cur.post >= 7 || d >= 4) ? `<div class="note danger">Если головокружение не проходит за 20 минут — сообщите специалисту TURA. При внезапных новых симптомах звоните 103 (или 112).</div>` : '';
  const c = cur.cam;
  app.innerHTML = `<div class="wrap">${header()}
    <h1>${cur.stopped ? 'Тренировка остановлена' : 'Тренировка завершена'}</h1>
    <div class="card"><div class="kv">
      <div><small>Подходы</small><b>${cur.setsDone} из ${cur.setsPlanned}</b></div>
      <div><small>Темп</small><b>${cur.bpm} уд/мин</b></div>
      <div><small>Головокружение</small><b>${cur.pre} → ${cur.post}</b></div>
      <div><small>Чёткость</small><b>${clarityWord(cur)}</b></div>
      ${c && c.n ? `<div><small>Скорость головы</small><b>${c.vel}°/с</b></div><div><small>${c.stab != null ? 'Взгляд на цели<span class="beta">β</span>' : 'Размах'}</small><b>${c.stab != null ? c.stab + '%' : c.amp + '°'}</b></div>` : ''}
    </div></div>
    ${box}${warn}
    <button class="btn btn-p" data-a="doneSession">Готово</button>
    ${ch && ch.applied ? `<button class="btn btn-s" data-a="undoChange">Оставить прежний уровень</button>` : ''}
  </div>`;
}

function endSession(){
  clearTimers(); clearInterval(camTick); Metro.stop(); exitFS(); releaseAwake(); Cam.stop();
  if(Cam.state === 'error') Cam.state = 'off';
  S = null; view = 'home'; render();
}

/* ---------- actions ---------- */
const A = {
  go:el => { if(el.dataset.v === 'rx') D = null; afterSafety = null; view = el.dataset.v; render(); },
  start:() => startSession('train'),
  startTest:() => startSession('test'),
  ackSafety:() => { DB.safetyAck = true; save(); const k = afterSafety; afterSafety = null; view = 'home'; if(k) startSession(k); else render(); },
  cancelSession:() => endSession(),
  flagNone:() => { S.step = S.kind === 'test' ? 'camcheck' : 'pre'; render(); },
  flagYes:() => { S.step = 'alarm'; render(); },
  rate:el => {
    const v = +el.dataset.v;
    if(S.step === 'pre'){ S.pre = v; S.step = v >= 7 ? 'preHigh' : 'setup'; render(); }
    else if(S.step === 'post'){ S.post = v; finishSession(); }
  },
  preAnyway:() => { S.step = 'setup'; render(); },
  setMode:el => { DB.mode = el.dataset.v; save(); render(); },
  toggleCam:() => { S.cam = !S.cam; DB.camOn = S.cam; save(); render(); },
  beginSet:() => { if(S.cam && !S.calib){ S.step = 'camcheck'; render(); } else startPhase('set'); },
  startCalib:() => startPhase('calib'),
  afterCalib:() => startPhase(S.kind === 'test' ? 'level' : 'set'),
  headOnly:() => { S.calib = null; startPhase('set'); },
  noCam:() => { S.cam = false; Cam.stop(); if(Cam.state === 'error') Cam.state = 'off'; startPhase('set'); },
  blur:() => { if(S && S.run && S.step === 'run'){ S.run.blur++; const c = document.getElementById('blurC'); if(c) c.textContent = S.run.blur; } },
  pause:() => {
    if(S.step === 'count'){
      clearTimers(); exitFS();
      if(S.cur.kind === 'level'){ finishTest('user'); return; }
      S.step = S.cur.kind === 'calib' ? 'camcheck' : 'setup'; render(); return;
    }
    pauseRun();
  },
  resume:() => resumeRun(),
  endTest:() => { Cam.stopRec(); finishTest('user'); },
  endEarly:() => { clearTimers(); exitFS(); releaseAwake(); Cam.stop(); S.step = 'post'; render(); },
  stopBad:() => { clearTimers(); Metro.stop(); exitFS(); releaseAwake(); if(S.run) cancelAnimationFrame(S.run.raf); Cam.stop(); S.stopped = true; S.step = 'stopBad'; render(); },
  toPost:() => { if(S.kind === 'test') finishTest('stopped'); else { S.step = 'post'; render(); } },
  clarity:el => afterClarity(+el.dataset.v),
  nextSet:() => { clearTimers(); S.setIdx++; startPhase('set'); },
  finishNow:() => { clearTimers(); exitFS(); releaseAwake(); Cam.stop(); S.step = 'post'; render(); },
  doneSession:() => endSession(),
  undoChange:() => {
    const cur = S.result.cur;
    if(cur.change && cur.change.applied){
      DB.rx.bpm = cur.change.from.bpm; DB.rx.setSec = cur.change.from.setSec; DB.rx.lastStep = cur.change.prevStep;
      cur.change.applied = false; save(); toast('Уровень оставлен прежним');
    }
    endSession();
  },
  copyReport:() => {
    const txt = reportText();
    const box = document.getElementById('repbox');
    const fallback = () => { box.innerHTML = `<div class="note info" style="margin-top:12px">Выделите текст и скопируйте вручную:</div><textarea class="rep" readonly>${esc(txt)}</textarea>`; const ta = box.querySelector('textarea'); ta.focus(); ta.select(); };
    try{
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast('Отчёт скопирован — вставьте в WhatsApp'), fallback);
      else fallback();
    }catch(e){ fallback(); }
  },
  seg:el => { D[el.dataset.k] = el.dataset.v; const y = window.scrollY; renderRx(); window.scrollTo(0, y); },
  step:el => {
    const k = el.dataset.k, st = STEP[k];
    D[k] = Math.max(st.min, Math.min(st.max, D[k] + st.d * (+el.dataset.d)));
    const o = document.getElementById('o_' + k); if(o) o.innerHTML = `${D[k]} <small>${st.unit}</small>`;
  },
  toggleAuto:el => { D.auto = !D.auto; el.classList.toggle('on', D.auto); },
  saveRx:() => {
    if(D.maxBpm < D.bpm) D.maxBpm = D.bpm;
    if(D.maxSetSec < D.setSec) D.maxSetSec = D.setSec;
    D.setAt = Date.now();
    DB.rx = {...D}; save(); D = null; toast('Назначение сохранено'); view = 'home'; render();
  },
  resetRx:() => { D = {...DEFAULT_RX, patient:D.patient, specialist:D.specialist}; renderRx(); toast('Стартовые параметры — сохраните, чтобы применить'); },
  wipe:() => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="card"><h2>Удалить все данные?</h2><p>Дневник тренировок, тесты и назначение будут удалены с этого устройства. Отменить нельзя.</p><button class="btn btn-d" data-a="wipeYes">Удалить</button><button class="btn btn-s" data-a="wipeNo">Отмена</button></div>`;
    document.body.appendChild(m);
  },
  wipeYes:() => { document.querySelector('.modal')?.remove(); DB = {rx:{...DEFAULT_RX}, sessions:[], tests:[], safetyAck:false, mode:'self', camOn:true}; save(); D = null; view = 'home'; render(); toast('Данные удалены'); },
  wipeNo:() => document.querySelector('.modal')?.remove()
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if(!el || el.disabled) return;
  const fn = A[el.dataset.a];
  if(fn){ e.preventDefault(); fn(el); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if(D && el.matches('input[type=text][data-k]')) D[el.dataset.k] = el.value;
});
document.addEventListener('visibilitychange', () => { if(document.hidden && S && S.step === 'run') pauseRun(); });

render();
</script>
</body>
</html>
