<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B6E6E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Неглект">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>TURA Неглект</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Токены TURA (как в VOR×1). Раскладка: меню в одну колонку до 640px, упражнения на весь экран. Одна светлая тема. */
:root{
  color-scheme: light;
  --bg:#F4F3EF; --card:#FFFFFF; --ink:#14222B; --ink2:#4A5963; --muted:#7A8790; --line:#E3E1DA;
  --brand:#0B6E6E; --brand-dark:#085858; --brand-soft:#DDEFEE;
  --cue:#E8892A; --cue-soft:#FDEBD0; --blue:#2A78D6;
  --danger:#B42318; --danger-soft:#FDE7E4; --ok:#1C7C3A; --ok-soft:#E3F3E7; --warn-soft:#FFF1D6;
  --k-spt:#0B6E6E; --k-scan:#E8892A; --k-ar:#2A78D6; --k-alert:#6B5BA8;
  --r:20px; --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --font:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
body.lock{overflow:hidden;position:fixed;inset:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + var(--st)) 16px calc(28px + var(--sb))}
.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
.logo{width:46px;height:46px;flex:none;border-radius:14px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.08em}
.ttl{font-size:20px;font-weight:800;line-height:1.1}
.sub{font-size:13px;color:var(--ink2);margin-top:2px}
.backbar{display:flex;align-items:center;gap:8px;margin:2px 0 12px}
.back{background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:46px;padding:0 16px;font-weight:700;font-size:15px;color:var(--ink2)}
h1{font-size:26px;line-height:1.15;margin:6px 0 10px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:17px;margin:0 0 10px;font-weight:800;text-wrap:balance}
p{line-height:1.5;margin:0 0 12px;color:var(--ink2);font-size:16px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:0 0 14px;border:1px solid var(--line);box-shadow:0 8px 24px -18px rgba(20,34,43,.35)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:16px;border:0;font-size:18px;font-weight:800;padding:14px 18px;text-align:center;line-height:1.2}
.btn-p{background:var(--brand);color:#fff}
.btn-p:active{background:var(--brand-dark)}
.btn-s{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn-d{background:var(--danger);color:#fff}
.btn-sm{min-height:46px;font-size:15px;border-radius:14px;padding:10px 14px}
.btn + .btn{margin-top:10px}
.btn:disabled{opacity:.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn + .btn{margin-top:0}
.navgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.navbtn{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:86px;text-align:left;display:flex;flex-direction:column;gap:4px}
.navbtn b{font-size:16px}
.navbtn span{font-size:13px;color:var(--ink2);line-height:1.35}
.navgrid .navbtn:last-child:nth-child(odd){grid-column:1/-1}
.eyebrow{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.big{font-size:30px;font-weight:800;line-height:1.1}
.row-sb{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.mixbar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:14px 0 8px;gap:2px}
.mixbar i{display:block;height:100%}
.mixleg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px}
.mixleg span{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ink2)}
.mixleg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.why{font-size:14px;margin-bottom:14px}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:5px 10px;white-space:nowrap;align-self:flex-start}
.tag.bottom{background:var(--brand-soft);color:var(--brand)}
.tag.mid{background:#EEF0F2;color:var(--ink2)}
.tag.top{background:var(--cue-soft);color:#7A4600}
.tag.manual{background:#ECE8F6;color:#4B3D8A}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 > div{background:var(--bg);border-radius:14px;padding:10px 12px;min-width:0}
.stat3 small{display:block;font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.stat3 b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stat3 em{display:block;font-style:normal;font-size:12px;color:var(--ink2);font-weight:600;margin-top:2px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--bg);border-radius:14px;padding:10px 12px}
.kv small{display:block;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.kv b{font-size:15px;line-height:1.3}
.kv svg{max-width:100%;height:auto;display:block;margin:4px auto 0}
.meta{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.4}
.note{border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.45;margin:0 0 14px}
.note b{display:block;margin-bottom:4px;font-size:16px}
.note.ok{background:var(--ok-soft);color:#0F4D24}
.note.warn{background:var(--warn-soft);color:#5C3500}
.note.danger{background:var(--danger-soft);color:#7A160F}
.note.info{background:var(--brand-soft);color:#063F3F}
.note .btn{margin-top:10px}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:0;min-height:46px;border:0;border-radius:11px;background:transparent;font-size:14px;font-weight:700;color:var(--ink2);padding:6px 8px;line-height:1.2}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 4px rgba(20,34,43,.16)}
.field{margin:0 0 18px}
.flabel{display:block;font-size:13px;font-weight:800;color:var(--ink2);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
.fhint{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.4}
input[type=text],input[type=url],input[type=password]{width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--line);padding:0 14px;font:inherit;font-size:16px;background:var(--card);color:var(--ink)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:14px;padding:12px 14px;border:0;width:100%;text-align:left;margin-bottom:8px}
.switch .knob{width:52px;height:32px;border-radius:16px;background:#C9CCC8;position:relative;flex:none;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on .knob{background:var(--brand)}
.switch.on .knob::after{left:23px}
.switch b{font-size:15px;display:block}
.switch span{font-size:13px;color:var(--ink2)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:50px;height:50px;flex:none;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:24px;font-weight:700}
.stepper output{flex:1;text-align:center;font-size:20px;font-weight:800}
.stepper output small{font-size:13px;color:var(--ink2);font-weight:600}
.cbs-item{border-top:1px solid var(--line);padding:14px 0}
.cbs-item:first-of-type{border-top:0;padding-top:4px}
.cbs-item .q{font-size:16px;font-weight:700;line-height:1.4;margin-bottom:10px}
.cbs-item .q i{font-style:normal;color:var(--muted);font-weight:800;margin-right:6px}
.cbs-item .seg button{font-size:13px}
.sticky{position:sticky;bottom:0;padding:12px 0 calc(12px + var(--sb));background:linear-gradient(to top,var(--bg) 70%,rgba(244,243,239,0))}
.yn{display:grid;grid-template-columns:1fr 92px 92px;gap:8px;align-items:center;border-top:1px solid var(--line);padding:12px 0}
.yn:first-of-type{border-top:0}
.yn span{font-size:16px;line-height:1.35;font-weight:600}
.yn button{min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:16px}
.yn button.on.y{background:var(--cue-soft);border-color:var(--cue);color:#7A4600}
.yn button.on.n{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.list-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;border-top:1px solid var(--line);padding:12px 0;align-items:center}
.list-row:first-of-type{border-top:0}
.list-row b{font-size:15px}
.list-row span{font-size:14px;color:var(--ink2)}
.linkbtn{background:none;border:0;color:var(--brand);font-weight:800;font-size:15px;padding:8px 0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .ax{font-size:11px;fill:var(--muted);font-family:var(--font)}
.chart .dl{font-size:12px;fill:var(--ink);font-weight:800;font-family:var(--font)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink2);font-weight:700;margin-bottom:6px}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink2)}
.chip b{color:var(--ink)}
pre.code{background:#0F1C22;color:#D9E6E6;border-radius:14px;padding:14px;font-size:12px;line-height:1.5;overflow-x:auto;white-space:pre;margin:0 0 10px}
.foot{font-size:12px;color:#7A8790;text-align:center;margin-top:24px;line-height:1.5}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.pinpad button{min-height:64px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);font-size:26px;font-weight:800}
.pindots{display:flex;gap:16px;justify-content:center;margin:8px 0 18px}
.pindots i{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--brand)}
.pindots i.on{background:var(--brand)}
.resmap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--sb));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;z-index:100;max-width:90vw;text-align:center;font-size:15px}
.camwrap{position:relative;width:min(72vw,300px);aspect-ratio:3/4;margin:4px auto 14px;border-radius:22px;overflow:hidden;background:#0D1A20}
.camv.parked{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none;z-index:-1}
.camv.preview{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.beta{font-size:10px;font-weight:800;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:1px 5px;margin-left:5px;vertical-align:middle}
.demo-banner{background:#ECE8F6;color:#3B2F70;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;margin-bottom:14px;line-height:1.4}
/* ---------- полноэкранные упражнения ---------- */
.ex{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none}
.exbar{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--st)) 12px 8px;background:var(--card);border-bottom:1px solid var(--line)}
.ib{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);font-size:18px;font-weight:800;flex:none}
.exbar .t{flex:1;min-width:0}
.exbar .t b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exbar .t small{font-size:12px;color:var(--muted);font-weight:700}
.tbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:5px}
.tbar i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s linear}
.clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:18px;min-width:52px;text-align:right}
.headchip{font-size:12px;font-weight:800;border-radius:999px;padding:6px 10px;background:var(--bg);color:var(--ink2);white-space:nowrap;font-variant-numeric:tabular-nums}
.headchip.on{background:var(--ok-soft);color:var(--ok)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:#fff}
.stage > svg,.stage > canvas,.stage > video{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage > video{object-fit:cover;background:#1B2A30}
.stage-foot{position:absolute;left:50%;bottom:calc(14px + var(--sb));transform:translateX(-50%);z-index:3;display:flex;gap:10px}
.pill-btn{min-height:54px;padding:0 24px;border-radius:999px;border:0;background:var(--ink);color:#fff;font-weight:800;font-size:16px;box-shadow:0 6px 18px -8px rgba(0,0,0,.5);white-space:nowrap}
.stage-hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:3;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:15px;font-weight:700;color:var(--ink2);max-width:min(560px,90%);text-align:center;transition:opacity .6s;pointer-events:none}
.stage-hint.gone{opacity:0}
.stage-msg{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:4;background:var(--ink);color:#fff;border-radius:16px;padding:14px 22px;font-size:20px;font-weight:800;pointer-events:none;text-align:center;max-width:86%}
.edgeflash{position:absolute;top:0;bottom:0;width:22px;background:var(--cue);z-index:2;pointer-events:none}
.overlay{position:absolute;inset:0;z-index:6;background:rgba(244,243,239,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:12px;text-align:center;overflow:auto}
.overlay .btn{max-width:440px}
.overlay h2{font-size:24px;margin:0}
.overlay p{max-width:540px;margin:0}
.overlay .kv{max-width:440px;width:100%;text-align:left}
.ov-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:440px;align-items:stretch}
.ov-actions .btn + .btn{margin-top:0}
.alert-stage{position:absolute;inset:0;display:grid;place-items:center}
.stim{width:min(42vmin,280px);height:min(42vmin,280px);transition:transform .12s}
.stim svg{width:100%;height:100%;display:block}
.stim.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.anchor-pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes flash{0%,100%{opacity:1}25%,75%{opacity:.1}}
.flash{animation:flash .45s ease-in-out 3}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.mark{transform-box:fill-box;transform-origin:center;animation:pop .18s ease-out}
/* поиск в комнате и съёмка комнаты */
.ar-card{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:4;background:rgba(255,255,255,.96);border-radius:18px;padding:8px 16px 8px 8px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px -12px rgba(0,0,0,.45);width:max-content;max-width:calc(100% - 24px);pointer-events:none}
.ar-card img{width:68px;height:68px;border-radius:12px;object-fit:cover;flex:none;background:#ddd}
.ar-card b{font-size:19px;line-height:1.2;display:block}
.ar-card small{display:block;font-size:13px;color:var(--ink2);font-weight:700;margin-top:2px}
.ar-card.big{top:42%;transform:translate(-50%,-50%);flex-direction:column;text-align:center;padding:16px;gap:10px;width:min(340px,calc(100% - 32px))}
.ar-card.big img{width:min(190px,50vw);height:min(190px,50vw)}
.ar-card.anchor img{width:96px;height:96px}
.ar-bottom{position:absolute;left:0;right:0;bottom:calc(12px + var(--sb));z-index:4;display:flex;justify-content:center;align-items:center;gap:10px;padding:0 12px;flex-wrap:wrap}
.ar-chip{background:rgba(255,255,255,.92);border-radius:999px;padding:9px 13px;font-size:13px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.pill-btn.brand{background:var(--brand)}
.pill-btn.light{background:rgba(255,255,255,.95);color:var(--ink)}
.room-panel{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-radius:20px 20px 0 0;padding:14px 16px calc(14px + var(--sb));max-height:60%;overflow:auto;box-shadow:0 -10px 30px -18px rgba(0,0,0,.5);touch-action:pan-y;user-select:text}
.room-panel p{font-size:15px;margin:0 0 10px}
.room-panel .btn{min-height:52px;font-size:16px}
.strip{display:flex;gap:12px;overflow-x:auto;padding:8px 2px 2px;margin-top:12px;touch-action:pan-x}
.strip .it{flex:none;width:86px;text-align:center;position:relative}
.strip img{width:86px;height:86px;border-radius:12px;object-fit:cover;display:block;background:#ddd}
.strip b{display:block;font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip span{display:block;font-size:11px;color:var(--ink2);font-weight:700}
.strip .del{position:absolute;top:-6px;right:-6px;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:var(--ink);color:#fff;font-weight:800;font-size:15px;line-height:1}
.namechips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.namechips button{min-height:42px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-weight:700;font-size:14px}
.namechips button.on{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
input[type=range]{width:100%;accent-color:var(--brand);height:36px}
.rotate-hint{display:none;position:absolute;inset:0;z-index:8;background:var(--bg);align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;padding:24px}
@media (orientation:portrait) and (max-width:700px){.rotate-hint{display:flex}}
@media (prefers-reduced-motion:reduce){.mark,.stim.shake{animation:none}.tbar i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';
/* ===================== TURA · Неглект — прототип v0.1 ===================== */
const APP_VER = '0.2';
const KEY = 'tura_neglect_v0';
const DEF_CFG = {
  patient:'', specialist:'', side:'L', sessionMin:25, gapHigh:5, gapLow:2,
  manual:false, manualPlan:{spt:8, scan:10, ar:5, alert:2},
  voice:true, oks:false, camOn:false, leftHand:false, sheetUrl:'',
  arMount:'hand', arCue:'auto', arAction:'reach'
};
const DEF_LV = {scan:1, spt:1, ar:1, alert:1};
const KINDS = ['spt','scan','ar','alert'];

let storageOK = true;
function fresh(){
  return {cfg:{...DEF_CFG, manualPlan:{...DEF_CFG.manualPlan}}, levels:{...DEF_LV}, cbs:[], tests:[], sessions:[], diary:{},
    head:null, pinHash:null, synced:{}, demo:false, room:null};
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw), c = d.cfg || {};
      return {
        cfg: Object.assign({}, DEF_CFG, c, {manualPlan: Object.assign({}, DEF_CFG.manualPlan, c.manualPlan || {})}),
        levels: Object.assign({}, DEF_LV, d.levels || {}),
        cbs: Array.isArray(d.cbs) ? d.cbs : [],
        tests: Array.isArray(d.tests) ? d.tests : [],
        sessions: Array.isArray(d.sessions) ? d.sessions : [],
        diary: d.diary && typeof d.diary === 'object' ? d.diary : {},

function bearingFrom(e){
  if(e.alpha == null || e.beta == null || e.gamma == null) return null;
  const d = Math.PI / 180, ca = Math.cos(e.alpha*d), sa = Math.sin(e.alpha*d), cb = Math.cos(e.beta*d), sb = Math.sin(e.beta*d), cg = Math.cos(e.gamma*d), sg = Math.sin(e.gamma*d);
  const vx = -(ca*sg + sa*sb*cg), vy = ca*sb*cg - sa*sg;
  if(Math.hypot(vx, vy) < .25) return null;
  return Math.atan2(vx, vy) / d;
}
// наклон задней камеры над горизонтом, градусы

  const d = Math.PI / 180, vz = -Math.cos(e.beta*d) * Math.cos(e.gamma*d);

}

const MODE_LABEL = {bottom:'Упор на автоматическое внимание', mid:'Сбалансированный план', top:'Упор на активный поиск', manual:'План специалиста'};
const SHARES = {
  bottom:{spt:.44, scan:.28, ar:.16, alert:.12},
  mid:{spt:.28, scan:.36, ar:.24, alert:.12},
  top:{spt:.16, scan:.38, ar:.34, alert:.12}

function planFor(){
  const c = DB.cfg, g = anosoGap();
  let mode, why;
  if(c.manual){
    mode = 'manual'; why = 'Состав занятия задал специалист вручную.';
  }else if(g === null){
    mode = 'mid'; why = 'Нет пары оценок по шкале CBS (куратор и пациент), поэтому план сбалансированный. Проведите оценку, и план подстроится.';
  }else if(g >= c.gapHigh){
    mode = 'bottom'; why = `Пациент оценивает свои трудности на ${String(g).replace('.', ',')} балла ниже, чем куратор. Это выраженная недооценка, поэтому больше упражнений, которые работают без осознания дефицита.`;
  }else if(g >= c.gapLow){
    mode = 'mid'; why = `Разница оценок куратора и пациента ${String(g).replace('.', ',')} балла: умеренная недооценка. Автоматическое и активное внимание тренируются поровну.`;
  }else{
    mode = 'top'; why = 'Пациент видит свои трудности почти так же, как куратор. Больше активного поиска и поворотов корпуса.';
  }
  let blocks;
  if(mode === 'manual'){
    blocks = KINDS.map(k => ({kind:k, min:Math.max(0, Math.round(c.manualPlan[k] || 0))})).filter(b => b.min > 0);
  }else{
    const total = c.sessionMin, sh = SHARES[mode];
    blocks = KINDS.map(k => ({kind:k, min:Math.max(2, Math.round(total * sh[k]))}));
    const diff = total - blocks.reduce((s, b) => s + b.min, 0);
    blocks[1].min = Math.max(2, blocks[1].min + diff);
  }
  return {mode, why, gap:g, blocks, total:blocks.reduce((s, b) => s + b.min, 0)};
}

const TW = 1000, TH = 640, LETTERS = 'АБВГДЕЖКМНПРСТУ';
function genTest(form){
  const rnd = mulberry32(1000 + form * 7919), cols = 12, rows = 8, x0 = 40, x1 = 960, y0 = 30, y1 = 610;
  const cw = (x1 - x0) / cols, rh = (y1 - y0) / rows, items = [];
  for(let c = 0; c < cols; c++){
    const idx = [...Array(rows).keys()];
    for(let i = idx.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    const tRows = new Set(idx.slice(0, 3));
    for(let r = 0; r < rows; r++){
      const x = Math.round(x0 + cw * (c + .5) + (rnd() - .5) * cw * .45), y = Math.round(y0 + rh * (r + .5) + (rnd() - .5) * rh * .4);
      const rot = Math.round((rnd() - .5) * 30);
      if(tRows.has(r)) items.push({x, y, t:1, kind:'star', rot});
      else{
        const k = rnd();
        items.push(k < .38 ? {x, y, t:0, kind:'bigstar', rot} : k < .72 ? {x, y, t:0, kind:'letter', ch:LETTERS[Math.floor(rnd() * LETTERS.length)]} : k < .86 ? {x, y, t:0, kind:'tri'} : {x, y, t:0, kind:'dot'});
      }
    }
  }
  return items.map((it, i) => ({...it, i}));
}
function testItemSVG(it){
  const x = it.x, y = it.y, ink = '#14222B';
  switch(it.kind){
    case 'star': return `<path d="${starPath(x, y, 12)}" transform="rotate(${it.rot} ${x} ${y})" fill="${ink}"/>`;
    case 'bigstar': return `<path d="${starPath(x, y, 22)}" transform="rotate(${it.rot} ${x} ${y})" fill="${ink}"/>`;
    case 'letter': return `<text x="${x}" y="${y + 9}" text-anchor="middle" font-size="27" font-weight="700" font-family="Manrope,system-ui,sans-serif" fill="${ink}">${it.ch}</text>`;
    case 'tri': return `<path d="M${x} ${y - 12}L${x + 11} ${y + 8}L${x - 11} ${y + 8}Z" fill="${ink}"/>`;
    default: return `<circle cx="${x}" cy="${y}" r="7" fill="${ink}"/>`;
  }
}
function segX(p1, p2, p3, p4){
  const d = (a, b, c) => (c.x - a.x) * (b.y - a.y) - (c.y - a.y) * (b.x - a.x);
  const d1 = d(p3, p4, p1), d2 = d(p3, p4, p2), d3 = d(p1, p2, p3), d4 = d(p1, p2, p4);
  return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
}
function scoreTest(items, taps, dur){
  const tg = items.filter(i => i.t), xs = tg.map(i => i.x), mn = Math.min(...xs), mx = Math.max(...xs);
  const nx = x => (x - mn) / (mx - mn) * 2 - 1;
  const seq = [], seen = new Set();
  for(const t of taps){ if(t.tg && !seen.has(t.i)){ seen.add(t.i); seq.push(t); } }
  const hitItems = tg.filter(i => seen.has(i.i));
  const meanAll = mean(tg.map(i => nx(i.x)));
  // центр вычёркивания (CoC, Rorden & Karnath 2010): средняя горизонтальная позиция найденных целей, −1…+1
  const coc = hitItems.length ? mean(hitItems.map(i => nx(i.x))) - meanAll : null;
  const L = tg.filter(i => i.x < TW / 2), R = tg.filter(i => i.x >= TW / 2);
  let path = 0; for(let k = 1; k < seq.length; k++) path += Math.hypot(seq[k].x - seq[k-1].x, seq[k].y - seq[k-1].y);
  let cross = 0; for(let a = 1; a < seq.length; a++) for(let b = a + 2; b < seq.length; b++) if(segX(seq[a-1], seq[a], seq[b-1], seq[b])) cross++;
  return {
    n:tg.length, hits:hitItems.length,
    hitsL:L.filter(i => seen.has(i.i)).length, nL:L.length, hitsR:R.filter(i => seen.has(i.i)).length, nR:R.length,
    coc: coc === null ? null : Math.round(coc * 1000) / 1000,
    fp:taps.filter(t => t.i >= 0 && !t.tg).length, rep:taps.filter(t => t.rep).length, blank:taps.filter(t => t.i < 0).length,
    dur:Math.round(dur * 10) / 10, path:Math.round(path / 100) / 10, cross,
    firstX: seq.length ? Math.round(nx(seq[0].x) * 100) / 100 : null
  };
}
const negHits = r => DB.cfg.side === 'R' ? [r.hitsR, r.nR] : [r.hitsL, r.nL];
function cocText(coc){
  if(coc === null) return 'Не найдено ни одной цели, поэтому центр вычёркивания не рассчитывается.';
  const a = Math.abs(coc), toR = coc > 0;
  if(a <= .08) return 'Поиск сбалансирован: найденные цели распределены почти поровну по обеим сторонам.';
  const typical = (toR && DB.cfg.side === 'L') || (!toR && DB.cfg.side === 'R');
  return `Найденные цели смещены ${toR ? 'вправо' : 'влево'}. ` + (typical ? `Это типичная картина: ${w().name.toLowerCase()} неглект.` : 'Смещение в необычную сторону. Проверьте настройку стороны неглекта у специалиста.');
}

/* ---------- графики ---------- */
function niceTicks(a, b, n = 4){ const step = (b - a) / n; return Array.from({length:n + 1}, (_, i) => a + step * i); }
function lineChart({labels, series, yMin, yMax, band, zero, fmt = v => v, h = 190}){
  const W = 560, H = h, pl = 40, pr = 40, pt = 14, pb = 26, n = labels.length;
  const X = i => n <= 1 ? pl + (W - pl - pr) / 2 : pl + i * (W - pl - pr) / (n - 1);
  const Y = v => pt + (yMax - v) / (yMax - yMin) * (H - pt - pb);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  if(band) s += `<rect x="${pl}" y="${Y(band[1])}" width="${W - pl - pr}" height="${Y(band[0]) - Y(band[1])}" fill="var(--ok-soft)"/>`;
  niceTicks(yMin, yMax).forEach(t => { s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text class="ax" x="${pl - 6}" y="${Y(t) + 4}" text-anchor="end">${fmt(t)}</text>`; });
  if(zero) s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--ink2)" stroke-dasharray="4 4"/>`;
  const idx = n <= 6 ? labels.map((_, i) => i) : [0, Math.floor((n - 1) / 2), n - 1];
  idx.forEach(i => { s += `<text class="ax" x="${X(i)}" y="${H - 6}" text-anchor="middle">${labels[i]}</text>`; });
  series.forEach(se => {
    const pts = se.values.map((v, i) => v == null ? null : [X(i), Y(clamp(v, yMin, yMax))]).filter(Boolean);
    if(pts.length > 1) s += `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${se.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
    pts.forEach((p, i) => { s += `<circle cx="${p[0]}" cy="${p[1]}" r="${i === pts.length - 1 ? 5.5 : 3.5}" fill="${i === pts.length - 1 ? se.color : '#fff'}" stroke="${se.color}" stroke-width="2.5"/>`; });
    const lastI = se.values.map((v, i) => v == null ? -1 : i).filter(i => i >= 0).pop();
    if(lastI != null) s += `<text class="dl" x="${X(lastI) + 9}" y="${Y(clamp(se.values[lastI], yMin, yMax)) + 4}">${fmt(se.values[lastI])}</text>`;
  });
  return s + '</svg>';
}
function barChart({labels, values, yMax, color, h = 150}){
  const W = 560, H = h, pl = 28, pr = 10, pt = 14, pb = 26, n = labels.length, bw = (W - pl - pr) / n;
  const Y = v => pt + (yMax - v) / yMax * (H - pt - pb);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  [0, yMax / 2, yMax].forEach(t => { s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text class="ax" x="${pl - 6}" y="${Y(t) + 4}" text-anchor="end">${Math.round(t)}</text>`; });
  values.forEach((v, i) => {
    const x = pl + i * bw + bw * .18, bwi = bw * .64;
    if(v == null){ s += `<rect x="${x}" y="${Y(0) - 2}" width="${bwi}" height="2" fill="var(--line)"/>`; return; }
    const y = Y(Math.max(v, 0)); s += `<rect x="${x}" y="${Math.min(y, Y(0) - 3)}" width="${bwi}" height="${Math.max(3, Y(0) - y)}" rx="3" fill="${color}"/>`;
    if(i === values.length - 1 || n <= 10) s += `<text class="dl" x="${x + bwi / 2}" y="${Math.min(y, Y(0) - 3) - 4}" text-anchor="middle">${Math.round(v)}</text>`;
  });
  [0, Math.floor((n - 1) / 2), n - 1].forEach(i => { s += `<text class="ax" x="${pl + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${labels[i]}</text>`; });
  return s + '</svg>';
}

function testMapSVG(t){

  let s = `<svg viewBox="0 0 ${TW} ${TH}" role="img" aria-label="Карта поиска"><line x1="${TW/2}" x2="${TW/2}" y1="10" y2="${TH-10}" stroke="var(--line)" stroke-width="2" stroke-dasharray="8 8"/>`;
  items.filter(i => !i.t).forEach(i => { s += `<circle cx="${i.x}" cy="${i.y}" r="4" fill="#D5D3CC"/>`; });
  if(seq.length > 1) s += `<polyline points="${seq.map(p => p.x + ',' + p.y).join(' ')}" fill="none" stroke="rgba(20,34,43,.35)" stroke-width="2.5" stroke-linejoin="round"/>`;

async function hashPin(pin){
  const msg = 'tura-neglect:' + pin;
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }catch(e){ let h = 0; for(const ch of msg) h = (h * 31 + ch.charCodeAt(0)) | 0; return 'x' + h; }
}

function runCalib(){
  const wd = w(), msg = document.getElementById('calMsg'), btn = document.getElementById('calBtn');
  if(!msg || Cam.state !== 'ready') return;
  btn.disabled = true; Snd.unlock();
  const A = [], B = []; let phase = 1; const t0 = performance.now();
  msg.textContent = 'Смотрите прямо в экран. Не двигайтесь 3 секунды.'; say('Смотрите прямо в экран', true);
  const tick = () => {
    if(view !== 'calib') return;
    const t = (performance.now() - t0) / 1000;
    if(Cam.face && isFinite(Cam.yaw)) (phase === 1 ? A : B).push(Cam.yaw);
    if(phase === 1 && t > 3){ phase = 2; Snd.cue(); msg.textContent = `Медленно поверните голову ${wd.dir} до упора и задержитесь.`; say(`Поверните голову ${wd.dir}`, true); }
    if(phase === 2 && t > 7){
      const base = median(A), tail = B.slice(Math.floor(B.length / 2)), turn = median(tail);
      btn.disabled = false;
      if(base == null || turn == null || A.length < 10 || B.length < 10){ msg.textContent = 'Лицо плохо видно. Улучшите освещение и повторите.'; return; }
      const range = Math.abs(turn - base);
      if(range < 8){ msg.textContent = `Поворот всего ${Math.round(range)}°. Повторите и поверните голову сильнее.`; return; }
      DB.head = {base, sign:Math.sign(turn - base) || 1, range, ts:Date.now()}; DB.cfg.camOn = true; save();
      msg.textContent = `Готово. Поворот ${Math.round(range)}°. Подсказка сработает, если пациент долго не поворачивает голову хотя бы на ${Math.round(headThr())}°.`;
      Snd.ok(); return;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function pendingRecords(){

async function syncNow(){

const MODS = {scan:SCAN, spt:SPT, ar:AR, alert:ALERT};
function hintFade(st, ms = 6000){ const h = st.querySelector('.stage-hint'); if(h) setTimeout(() => h.classList.add('gone'), ms); }

/* --- 1. Поиск и сканирование (top-down) --- */
function SCAN(st, o){
  const s = sgn(), wd = w(), Wp = st.clientWidth || 900, Hp = st.clientHeight || 560;
  const VW = 1000, VH = Math.max(420, Math.round(VW * Hp / Wp)), footU = 100 * VH / Hp;
  let level = o.level, sheet = null, paused = false, done = false, nextT = 0;
  const M = {level0:level, sheets:0, negHit:0, negTot:0, intHit:0, intTot:0, fp:0, cues:0, early:0, oN:0, oY:0};
  st.innerHTML = `<svg viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="none"></svg><div class="stage-foot"><button class="pill-btn" id="scDone">Я всё нашёл</button></div>`;
  const svg = st.querySelector('svg');
  const isNeg = x => s < 0 ? x < VW / 2 : x >= VW / 2;
  const P = L => ({nT:Math.min(26, 6 + 2 * L), nD:Math.min(44, 4 * L), wf:Math.min(1, .55 + .09 * (L - 1)),
    anchor: L <= 3 ? 'pulse' : L <= 6 ? 'on' : L <= 8 ? 'faint' : 'none', conj: L >= 6, r: Math.max(19, 31 - L)});
  function newSheet(){
    const p = P(level), fw = VW * p.wf, fx0 = (VW - fw) / 2, fx1 = fx0 + fw, fy0 = 26, fy1 = VH - footU - 8, items = [], minD = p.r * 2.7;
    const place = cond => { for(let k = 0; k < 500; k++){ const x = fx0 + p.r + 34 + Math.random() * (fw - 2 * p.r - 68), y = fy0 + p.r + Math.random() * (fy1 - fy0 - 2 * p.r); if(!cond(x)) continue; if(items.every(it => Math.hypot(it.x - x, it.y - y) >= minD)) return {x, y}; } return null; };
    const nNeg = Math.round(p.nT * .6);
    for(let k = 0; k < p.nT; k++){ const q = place(x => k < nNeg ? isNeg(x) : !isNeg(x)); if(q) items.push({...q, t:1, f:0}); }
    const kinds = p.conj ? ['bc','bs','bt','os','ot'] : ['bc','bs','bt'];
    for(let k = 0; k < p.nD; k++){ const q = place(() => true); if(q) items.push({...q, t:0, k:kinds[Math.floor(Math.random() * kinds.length)]}); }
    sheet = {items, p, fx0, fx1, fy0, fy1, t0:performance.now(), lastNeg:performance.now(), warned:false};
    draw();
  }
  function shape(it, r){
    const O = '#E8892A', B = '#2A78D6', x = it.x.toFixed(1), y = it.y.toFixed(1);
    if(it.t) return `<circle cx="${x}" cy="${y}" r="${r}" fill="${O}"/><circle cx="${x}" cy="${y}" r="${(r * .32).toFixed(1)}" fill="#fff"/>`;
    const c = it.k[0] === 'o' ? O : B, k = it.k[1];
    if(k === 'c') return `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
    if(k === 's') return `<rect x="${(it.x - r * .88).toFixed(1)}" y="${(it.y - r * .88).toFixed(1)}" width="${(r * 1.76).toFixed(1)}" height="${(r * 1.76).toFixed(1)}" rx="5" fill="${c}"/>`;
    return `<path d="M${x} ${(it.y - r).toFixed(1)}L${(it.x + r).toFixed(1)} ${(it.y + r * .8).toFixed(1)}L${(it.x - r).toFixed(1)} ${(it.y + r * .8).toFixed(1)}Z" fill="${c}"/>`;
  }
  function draw(){
    const p = sheet.p, ax = s < 0 ? sheet.fx0 + 4 : sheet.fx1 - 22;
    let h = `<rect x="${sheet.fx0}" y="${sheet.fy0 - 10}" width="${sheet.fx1 - sheet.fx0}" height="${sheet.fy1 - sheet.fy0 + 20}" rx="18" fill="#FBFAF7"/>`;
    if(p.anchor !== 'none') h += `<rect class="anchor ${p.anchor === 'pulse' ? 'anchor-pulse' : ''}" x="${ax}" y="${sheet.fy0}" width="18" height="${sheet.fy1 - sheet.fy0}" rx="9" fill="#E8892A" opacity="${p.anchor === 'faint' ? .35 : 1}"/>`;
    h += sheet.items.map(it => `<g data-i>${shape(it, p.r)}</g>`).join('') + '<g id="scMarks"></g>';
    svg.innerHTML = h;
  }
  function markFound(it){
    const g = svg.querySelector('#scMarks'), r = sheet.p.r;
    g.insertAdjacentHTML('beforeend', `<g class="mark"><circle cx="${it.x}" cy="${it.y}" r="${r + 7}" fill="rgba(255,255,255,.72)" stroke="#0B6E6E" stroke-width="4"/><path d="M${it.x - r * .45} ${it.y}l${r * .32} ${r * .34}l${r * .6} -${r * .66}" fill="none" stroke="#0B6E6E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>`);
  }
  function cue(){
    M.cues++;
    const a = svg.querySelector('.anchor');
    if(a){ a.classList.remove('anchor-pulse'); restartAnim(a, 'flash'); setTimeout(() => { if(sheet && sheet.p.anchor === 'pulse') a.classList.add('anchor-pulse'); }, 1500); }
    else{ const d = document.createElement('div'); d.className = 'edgeflash flash'; d.style[s < 0 ? 'left' : 'right'] = '0'; st.appendChild(d); setTimeout(() => d.remove(), 1500); }
    Snd.cue(); say(`Посмотрите ${wd.dir}`);
  }
  function endSheet(){
    const T2 = sheet.items.filter(i => i.t), neg = T2.filter(i => isNeg(i.x)), int = T2.filter(i => !isNeg(i.x));
    const nh = neg.filter(i => i.f).length, ih = int.filter(i => i.f).length;
    M.negHit += nh; M.negTot += neg.length; M.intHit += ih; M.intTot += int.length; M.sheets++;
    const rate = neg.length ? nh / neg.length : 1;
    if(rate >= .9 && !sheet.warned) level = Math.min(10, level + 1);
    else if(rate < .6) level = Math.max(1, level - 1);
    stageMsg(st, rate === 1 && ih === int.length ? 'Отлично! Все найдены' : `Найдено ${nh + ih} из ${T2.length}`);
    sheet = null; nextT = setTimeout(() => { if(!done) newSheet(); }, 1300);
  }
  svg.addEventListener('pointerdown', e => {
    if(paused || done || !sheet) return; e.preventDefault();
    const p = svgPt(svg, e); let best = null, bd = 1e9;
    for(const it of sheet.items){ const d = Math.hypot(it.x - p.x, it.y - p.y); if(d < bd){ bd = d; best = it; } }
    if(!best || bd > sheet.p.r * 1.6) return;
    if(best.t){
      if(best.f) return;
      best.f = 1; markFound(best); Snd.ok();
      if(isNeg(best.x)) sheet.lastNeg = performance.now();
      if(sheet.items.every(it => !it.t || it.f)) endSheet();
    }else{ M.fp++; Snd.soft(); }
  });
  st.querySelector('#scDone').addEventListener('click', () => {
    if(paused || done || !sheet) return;
    const rem = sheet.items.filter(it => it.t && !it.f), remNeg = rem.filter(it => isNeg(it.x)).length;
    if(rem.length && !sheet.warned){ sheet.warned = true; M.early++; stageMsg(st, remNeg ? `Ещё не всё. Посмотрите ${wd.adv}` : 'Ещё не всё. Посмотрите внимательно', 2000); if(remNeg) cue(); return; }
    endSheet();
  });
  const cueDelay = () => level <= 4 ? 7000 : 11000;
  const iv = setInterval(() => {
    if(paused || done || !sheet) return;
    if(headLive()){ M.oN++; if(Cam.turn() >= headThr()) M.oY++; }
    const now = performance.now(), remNeg = sheet.items.some(it => it.t && !it.f && isNeg(it.x));
    if(remNeg && now - sheet.lastNeg > cueDelay()){
      const need = headLive() ? !Cam.orientedWithin(cueDelay() / 1000, headThr()) : true;
      if(need) cue();
      sheet.lastNeg = now;
    }
  }, 500);
  newSheet();
  return {
    pause(){ paused = true; },
    resume(){ paused = false; if(sheet) sheet.lastNeg = performance.now(); },
    finish(){
      done = true; clearInterval(iv); clearTimeout(nextT);
      return {level0:M.level0, level1:level, sheets:M.sheets, negRate:M.negTot ? M.negHit / M.negTot : null, intRate:M.intTot ? M.intHit / M.intTot : null,
        fp:M.fp, cues:M.cues, early:M.early, oriented:M.oN ? M.oY / M.oN : null};
    }
  };
}

/* --- 2. Плавное слежение и оптокинетическая стимуляция (bottom-up) --- */
function SPT(st, o){
  st.innerHTML = `<canvas></canvas><div class="stage-hint">Следите глазами за фигурами. Оранжевую коснитесь.</div>`;
  const cv = st.querySelector('canvas'), ctx = cv.getContext('2d'), s = sgn();
  let W = 0, H = 0;
  const size = () => { const d = Math.min(2, window.devicePixelRatio || 1); W = st.clientWidth || 900; H = st.clientHeight || 560; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
  size(); window.addEventListener('resize', size);
  let level = o.level, paused = false, done = false, raf = 0, last = performance.now(), objs = [], bg = 0, act = 0;
  let nextProbe = 2500 + Math.random() * 2000;
  const M = {level0:level, probes:0, hits:0, rts:[], zones:[[0,0],[0,0],[0,0]]};
  let ep = {p:0, h:0, t:0};
  const ROWS = [.26, .5, .74], COLS = ['#0B6E6E', '#14222B', '#2A78D6'];
  const R = () => clamp(Math.min(W, H) * .045, 16, 34), gap = () => W * .22;
  const speed = () => W * (.035 + .011 * level);
  const mk = (x, row) => ({x, row, y:H * ROWS[row] + (Math.random() - .5) * H * .06, c:COLS[Math.floor(Math.random() * 3)], sh:Math.random() < .5 ? 'c' : 's', probe:false, used:false, pt:0, z:0});
  for(let row = 0; row < 3; row++){ const off = Math.random() * gap(); for(let x = off; x < W + gap(); x += gap()) objs.push(mk(x, row)); }
  const edgeIn = () => s < 0 ? W + R() : -R();
  const progress = x => s < 0 ? 1 - x / W : x / W;   // 0 у замечаемого края, 1 у игнорируемого
  function step(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if(!paused && !done){
      act += dt; ep.t += dt;
      const v = speed();
      bg = (bg + s * v * 1.15 * dt) % (W * .12);
      objs.forEach(ob => { ob.x += s * v * dt; });
      objs = objs.filter(ob => {
        const out = s < 0 ? ob.x < -R() * 1.5 : ob.x > W + R() * 1.5;
        if(out && ob.probe){ ob.probe = false; Snd.soft(); }
        return !out;
      });
      for(let row = 0; row < 3; row++){
        const rowObjs = objs.filter(ob => ob.row === row), ex = edgeIn();
        const nearest = rowObjs.reduce((m, ob) => Math.min(m, Math.abs(ob.x - ex)), Infinity);
        if(nearest >= gap()) objs.push(mk(ex, row));
      }
      const probe = objs.find(ob => ob.probe);
      if(probe && now - probe.pt > 2600){ probe.probe = false; }
      nextProbe -= dt * 1000;
      if(!probe && nextProbe <= 0){
        const cand = objs.filter(ob => !ob.used && ob.x > W * .1 && ob.x < W * .9);
        if(cand.length){
          const ob = cand[Math.floor(Math.random() * cand.length)], pr = progress(ob.x);
          ob.probe = true; ob.used = true; ob.pt = now; ob.z = pr < 1/3 ? 0 : pr < 2/3 ? 1 : 2;
          M.probes++; ep.p++; M.zones[ob.z][0]++;
        }
        nextProbe = 3200 + Math.random() * 3600;
      }
      if(ep.t >= 45){
        if(ep.p >= 4){ const r = ep.h / ep.p; if(r >= .85) level = Math.min(10, level + 1); else if(r < .5) level = Math.max(1, level - 1); }
        ep = {p:0, h:0, t:0};
      }
    }
    draw(now);
    raf = requestAnimationFrame(step);
  }
  function draw(now){
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
    if(DB.cfg.oks){
      const sw2 = W * .06; ctx.fillStyle = '#E9EFEF';
      for(let x = -W * .12 + bg; x < W + W * .12; x += W * .12) ctx.fillRect(x, 0, sw2, H);
    }
    const r = R();
    objs.forEach(ob => {
      ctx.fillStyle = ob.probe ? '#E8892A' : ob.c;
      if(ob.probe){ ctx.save(); ctx.strokeStyle = 'rgba(232,137,42,.35)'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(ob.x, ob.y, r + 9 + 3 * Math.sin(now / 120), 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
      if(ob.sh === 'c' || ob.probe){ ctx.beginPath(); ctx.arc(ob.x, ob.y, r, 0, Math.PI * 2); ctx.fill(); }
      else{ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(ob.x - r * .88, ob.y - r * .88, r * 1.76, r * 1.76, 6) : ctx.rect(ob.x - r * .88, ob.y - r * .88, r * 1.76, r * 1.76); ctx.fill(); }
    });
  }
  cv.addEventListener('pointerdown', e => {
    if(paused || done) return; e.preventDefault();
    const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
    const ob = objs.find(q => q.probe && Math.hypot(q.x - x, q.y - y) <= R() * 1.9 + 14);
    if(ob){ ob.probe = false; M.hits++; ep.h++; M.zones[ob.z][1]++; M.rts.push((performance.now() - ob.pt) / 1000); Snd.ok(); }
  });
  hintFade(st);
  raf = requestAnimationFrame(step);
  return {
    pause(){ paused = true; },
    resume(){ paused = false; last = performance.now(); },
    finish(){ done = true; cancelAnimationFrame(raf); window.removeEventListener('resize', size);
      return {level0:M.level0, level1:level, probes:M.probes, hits:M.hits, rt:mean(M.rts), zones:M.zones}; }
  };
}

/* --- 3. Поиск в комнате: предметы пациента или звезда; камера + гироскоп, поворот корпуса --- */
function OriTracker(){
  const t = {
    got:false, raw:null, el:null, b0:null, smooth:null, rel:0,
    handler: e => {
      const br = bearingFrom(e); if(br == null) return;
      t.got = true; t.raw = br;
      const el = elevFrom(e); if(el != null) t.el = el;
      if(t.b0 === null) return;
      const r = wrap180(br - t.b0);
      t.smooth = t.smooth === null ? r : t.smooth + wrap180(r - t.smooth) * .25;
      t.rel = t.smooth;
    },
    start(){ window.addEventListener('deviceorientation', t.handler); },
    stop(){ window.removeEventListener('deviceorientation', t.handler); },
    zero(){ if(t.raw != null) t.b0 = t.raw; t.smooth = 0; t.rel = 0; }
  };
  return t;
}
async function backCamera(video){
  if(!ENV.camera || ENV.framed) return null;
  try{
    const sm = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}});
    video.srcObject = sm; try{ await video.play(); }catch(e){}
    return sm;
  }catch(e){ return null; }
}
function arArrow(ctx, x, y, dir, col){   // dir = 1: стрелка влево, −1: вправо
  ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1); ctx.fillStyle = col;
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.moveTo(-34, 0); ctx.lineTo(4, -30); ctx.lineTo(4, -12); ctx.lineTo(34, -12); ctx.lineTo(34, 12); ctx.lineTo(4, 12); ctx.lineTo(4, 30); ctx.closePath(); ctx.fill(); ctx.restore();
}
function arLabel(ctx, text, x, y){
  ctx.font = '800 17px Manrope, system-ui, sans-serif'; const tw = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(20,34,43,.85)'; ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x - tw / 2 - 14, y - 22, tw + 28, 38, 12); else ctx.rect(x - tw / 2 - 14, y - 22, tw + 28, 38);
  ctx.fill(); ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(text, x, y + 4);
}
function arRoundImg(ctx, im, x, y, sz){
  ctx.save(); ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x - sz / 2, y - sz / 2, sz, sz, 12); else ctx.rect(x - sz / 2, y - sz / 2, sz, sz);
  ctx.clip(); if(im && im.complete && im.naturalWidth) ctx.drawImage(im, x - sz / 2, y - sz / 2, sz, sz); else { ctx.fillStyle = '#CFC8BA'; ctx.fill(); }
  ctx.restore();
}

function AR(st, o){
  const s = sgn(), wd = w(), cfg = DB.cfg, items = roomItems(), home = items.length > 0, chest = cfg.arMount === 'chest';
  st.innerHTML = `<video playsinline muted autoplay></video><canvas></canvas>
    <div class="ar-card" id="arCard" hidden></div>
    <div class="stage-hint" id="arHint" style="top:auto;bottom:calc(84px + var(--sb))">${chest ? 'Телефон в креплении на груди. Поворачивайтесь корпусом и слушайте звук.' : 'Держите телефон перед грудью и поворачивайтесь всем корпусом.'}</div>
    <div class="ar-bottom" id="arBottom"></div>`;
  const video = st.querySelector('video'), cv = st.querySelector('canvas'), ctx = cv.getContext('2d');
  const card = st.querySelector('#arCard'), bottom = st.querySelector('#arBottom'), hint = st.querySelector('#arHint');
  let W = 0, H = 0;
  const size = () => { const d = Math.min(2, window.devicePixelRatio || 1); W = st.clientWidth || 390; H = st.clientHeight || 700; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
  size(); window.addEventListener('resize', size);
  const fovH = () => H > W ? 46 : 62, fovV = () => H > W ? 62 : 46;
  let level = o.level, paused = false, pauseAt = 0, done = false, raf = 0, last = performance.now(), stream = null, camOK = false;
  const ori = OriTracker(); if(!ENV.framed) ori.start();
  let demoRel = 0, drag = null;
  const rel = () => ori.got ? ori.rel : demoRel;
  const elv = () => ori.got && ori.el != null ? ori.el : 0;
  let phase = 'center', centerT = 0, hold = 0, tStart = 0, tgt = null, cue = 0, maxCue = 0, lastBeep = 0, lastCueSnd = 0, recent = [], pendingRec = null;
  const M = {level0:level, found:0, missed:0, times:[], maxA:0, cues:[], noCue:0, actDone:0, actFail:0, trials:[]};
  let trio = {n:0, f:0, cue:0};
  const imgs = {}; items.forEach(it => { const im = new Image(); im.src = it.photo; imgs[it.id] = im; });
  const anchor = DB.room && DB.room.anchor; let anchorImg = null;
  if(anchor && anchor.photo){ anchorImg = new Image(); anchorImg.src = anchor.photo; }
  backCamera(video).then(sm => {
    if(done){ if(sm) sm.getTracks().forEach(t => t.stop()); return; }
    if(sm){ stream = sm; camOK = true; } else video.style.display = 'none';
  });

  function showCard(title, sub, photo, big){
    card.hidden = false; card.className = 'ar-card' + (big ? ' big' : '');
    card.innerHTML = (photo ? `<img src="${photo}" alt="">` : '') + `<div><b>${esc(title)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div>`;
  }
  const hideCard = () => { card.hidden = true; };
  const setBottom = html => { bottom.innerHTML = html; };
  const infoChip = () => `<span class="ar-chip" id="arInfo"></span>`;

  function toAnchor(){
    phase = 'anchor'; tgt = null;
    showCard('Наведите на якорь', anchor ? 'Поймайте его в кольцо, как на фото, и нажмите «Это якорь».' : 'Поймайте в кольцо предмет прямо перед пациентом.', anchor && anchor.photo, false);
    card.classList.add('anchor');
    setBottom(`<button class="pill-btn brand" data-ar="anchor">Это якорь</button>`);
    say('Наведите телефон на якорь', true);
  }
  function toCenter(){
    phase = 'center'; centerT = 0; tgt = null; hideCard();
    setBottom(infoChip() + (home ? `<button class="pill-btn light" data-ar="reanchor">Якорь</button>` : ''));
  }
  function newTrial(){
    tStart = performance.now(); hold = 0; cue = 0; maxCue = 0; lastCueSnd = 0; phase = 'seek';
    if(home){
      const pool = items.filter(it => !recent.includes(it.id)), src = pool.length ? pool : items;
      const wts = src.map(it => isNegTh(it.th) ? 3 : 1), sum = wts.reduce((a, b) => a + b, 0);
      let r = Math.random() * sum, it = src[0];
      for(let i = 0; i < src.length; i++){ r -= wts[i]; if(r <= 0){ it = src[i]; break; } }
      recent.push(it.id); while(recent.length > Math.min(2, items.length - 1)) recent.shift();
      tgt = {id:it.id, name:it.name, th:it.th, el:it.el == null ? null : it.el, photo:it.photo};
      showCard('Найдите: ' + it.name, chest ? '' : 'Наведите кольцо на предмет', it.photo, false);
      say('Найдите: ' + it.name, true);
      setBottom(infoChip() + `<button class="pill-btn brand" data-ar="found">Нашёл</button>`);
    }else{
      const maxT = Math.min(90, 25 + 9 * (level - 1)), minT = Math.min(12 + 3 * level, maxT - 6);
      tgt = {th:s * (minT + Math.random() * (maxT - minT)), el:null, y:.32 + Math.random() * .3, size:Math.max(.62, 1 - .045 * (level - 1)), name:'звезда'};
      hideCard(); say(`Найдите звезду ${wd.adv}`); setBottom(infoChip());
    }
  }
  function afterTrial(rec){
    M.trials.push(rec); M.cues.push(rec.cue);
    trio.n++; if(rec.found) trio.f++; trio.cue += rec.cue;
    if(trio.n >= 3){
      const mc = trio.cue / 3;
      if(trio.f === 3 && mc <= 1) level = Math.min(10, level + 1);
      else if(trio.f <= 1 || mc >= 3) level = Math.max(1, level - 1);
      trio = {n:0, f:0, cue:0};
    }
    toCenter();
  }
  function found(how){
    const t = (performance.now() - tStart) / 1000;
    M.found++; M.times.push(t); if(maxCue === 0) M.noCue++;
    Snd.ok();
    const rec = {name:tgt.name, th:Math.round(tgt.th), neg:isNegTh(tgt.th), found:true, t:Math.round(t * 10) / 10, cue:maxCue, how};
    if(home && cfg.arAction !== 'none'){
      const act = cfg.arAction === 'alternate' ? (M.found % 2 ? 'reach' : 'name') : cfg.arAction;
      rec.act = act; pendingRec = rec; phase = 'action';
      showCard(act === 'reach' ? 'Покажите рукой' : 'Назовите предмет', act === 'reach' ? `Покажите на предмет ${wd.ag} рукой. Если он рядом, дотянитесь.` : 'Скажите вслух, что это.', tgt.photo, false);
      say(act === 'reach' ? `Покажите ${wd.ag} рукой` : 'Назовите, что это', true);
      setBottom(`<button class="pill-btn light" data-ar="actFail">Не получилось</button><button class="pill-btn brand" data-ar="actOk">Сделано</button>`);
    }else afterTrial(rec);
  }
  function miss(){
    M.missed++; Snd.soft();
    stageMsg(st, home ? `${tgt.name}: не найдено` : 'Не найдено', 1500);
    afterTrial({name:tgt.name, th:Math.round(tgt.th), neg:isNegTh(tgt.th), found:false, t:null, cue:maxCue});
  }
  bottom.addEventListener('click', e => {
    const b = e.target.closest('[data-ar]'); if(!b || paused || done) return;
    e.stopPropagation();
    const a = b.dataset.ar;
    if(a === 'reanchor'){ toAnchor(); return; }
    if(a === 'anchor'){ ori.zero(); demoRel = 0; Snd.ok(); toCenter(); return; }
    if(a === 'found' && phase === 'seek'){ found('manual'); return; }
    if((a === 'actOk' || a === 'actFail') && phase === 'action' && pendingRec){
      pendingRec.actOk = a === 'actOk'; if(pendingRec.actOk) M.actDone++; else M.actFail++;
      const r = pendingRec; pendingRec = null; afterTrial(r);
    }
  });
  // демо без гироскопа: «поворот» пальцем или стрелками клавиатуры
  const pd = e => { if(ori.got) return; drag = e.clientX; if(cv.setPointerCapture) cv.setPointerCapture(e.pointerId); };
  const pm = e => { if(ori.got || drag === null) return; const dx = e.clientX - drag; drag = e.clientX; demoRel = clamp(demoRel - dx / W * fovH(), -150, 150); };
  const pu = () => { drag = null; };
  cv.addEventListener('pointerdown', pd); cv.addEventListener('pointermove', pm); cv.addEventListener('pointerup', pu); cv.addEventListener('pointercancel', pu);
  const kd = e => { if(ori.got) return; if(e.key === 'ArrowLeft') demoRel -= 4; if(e.key === 'ArrowRight') demoRel += 4; };
  window.addEventListener('keydown', kd);
  setTimeout(() => { if(!ori.got && hint && !done){ hint.textContent = ENV.framed ? 'Демо-режим: проведите пальцем по экрану, чтобы «повернуться».' : 'Нет данных датчика движения. Разрешите его в настройках браузера. Пока можно «поворачиваться» пальцем.'; hint.classList.remove('gone'); } }, 1600);

  const cueDelay = () => 3 + .6 * level;
  function cueFor(el){ const m = cfg.arCue; if(m === 'off') return 0; if(m === 'always') return el < cueDelay() ? 3 : 4; return clamp(Math.floor(el / cueDelay()), 0, 4); }

  function step(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    if(!home && ori.got && ori.b0 === null) ori.zero();
    if(!paused && !done){
      if(phase === 'center'){
        if(Math.abs(rel()) < 10){ centerT += dt; if(centerT > .7) newTrial(); } else centerT = 0;
      }else if(phase === 'seek'){
        const el = (now - tStart) / 1000, off = tgt.th - rel(), dirW = off < 0 ? 'влево' : 'вправо';
        M.maxA = Math.max(M.maxA, s * rel());
        const c = cueFor(el);
        if(c > cue){
          cue = c; maxCue = Math.max(maxCue, c);
          if(c === 1){ Snd.cue(Math.sign(off) || sgn()); lastCueSnd = now; }
          if(c === 3) say(`Поворачивайтесь ${dirW}`, true);
          if(c === 4) say(home ? `${tgt.name} ${off < 0 ? 'слева' : 'справа'}. Поворачивайтесь ${dirW}` : `Поворачивайтесь ${dirW}`, true);
        }
        const hot = chest ? 2 : 4;
        if(cue >= 1 && cue < hot && now - lastCueSnd > 4000){ lastCueSnd = now; Snd.cue(Math.sign(off) || sgn()); }
        if(cue >= hot){
          const a = Math.min(1, Math.abs(off) / 90), iv = 220 + a * 1100;
          if(now - lastBeep > iv){ lastBeep = now; Snd.tone(1100 - a * 600, .07, .11, 'sine', clamp(off / 30, -1, 1)); }
        }
        const tol = home ? 9 : 6 * tgt.size + 3;
        const vOK = !home || tgt.el == null || !ori.got || Math.abs(tgt.el - elv()) < 20;
        if(Math.abs(off) < tol && vOK){ hold += dt; if(hold >= 1) found('auto'); }
        else hold = Math.max(0, hold - dt * 2);
        if(phase === 'seek' && el > (home ? 40 : 25)) miss();
      }
    }
    draw(now);
    raf = requestAnimationFrame(step);
  }
  const X = th => W / 2 + (th - rel()) * W / fovH();
  const cyBase = () => H * .45;
  const Yel = e => cyBase() - (e - elv()) * H / fovV();
  function draw(now){
    ctx.clearRect(0, 0, W, H);
    if(!camOK){
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#E4ECEC'); g.addColorStop(.62, '#D8E2E2'); g.addColorStop(.621, '#C9C2B4'); g.addColorStop(1, '#B9B1A2');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(20,34,43,.16)'; ctx.lineWidth = 2; ctx.font = '700 12px Manrope, system-ui, sans-serif'; ctx.fillStyle = 'rgba(20,34,43,.45)'; ctx.textAlign = 'center';
      for(let m = -150; m <= 150; m += 15){
        const x = X(m); if(x < -40 || x > W + 40) continue;
        ctx.beginPath(); ctx.moveTo(x, H * .16); ctx.lineTo(x, H * .62); ctx.stroke();
        ctx.fillText(m === 0 ? (home ? 'якорь' : 'прямо') : Math.abs(m) + '°', x, H * .14);
      }
      if(home){
        const sz = Math.min(W, H) * .2;
        if(anchorImg) arRoundImg(ctx, anchorImg, X(0), cyBase(), sz);
        items.forEach(it => { const x = X(it.th); if(x < -sz || x > W + sz) return; arRoundImg(ctx, imgs[it.id], x, it.el != null ? Yel(it.el) : cyBase(), sz); });
      }
    }
    const cy = tgt && !home ? H * tgt.y : cyBase(), rr = Math.min(W, H) * .1;
    if(phase === 'seek' && tgt){
      const off = tgt.th - rel(), x = X(tgt.th), onScr = x > 20 && x < W - 20;
      if(!home){
        const ts = rr * .55 * tgt.size, pulse = 1 + .07 * Math.sin(now / 180);
        if(onScr){
          ctx.save(); ctx.shadowColor = 'rgba(232,137,42,.8)'; ctx.shadowBlur = 24; ctx.fillStyle = '#E8892A';
          const p = new Path2D(starPath(x, cy, ts * pulse)); ctx.fill(p); ctx.restore();
          ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke(new Path2D(starPath(x, cy, ts * pulse)));
        }
      }else if(cue >= 4 && onScr){
        const y = tgt.el != null && ori.got ? Yel(tgt.el) : cyBase(), r2 = rr * 1.15 + 6 * Math.sin(now / 150);
        ctx.lineWidth = 7; ctx.strokeStyle = '#E8892A'; ctx.beginPath(); ctx.arc(x, y, r2, 0, Math.PI * 2); ctx.stroke();
        arLabel(ctx, 'здесь', x, y - r2 - 26);
      }
      if(cue >= 2 && !onScr){
        const left = off < 0, a = .55 + .35 * Math.sin(now / 160);
        const g = ctx.createLinearGradient(left ? 0 : W, 0, left ? 46 : W - 46, 0);
        g.addColorStop(0, `rgba(232,137,42,${a})`); g.addColorStop(1, 'rgba(232,137,42,0)');
        ctx.fillStyle = g; ctx.fillRect(left ? 0 : W - 46, 0, 46, H);
      }
      if(cue >= 3 && (!onScr || Math.abs(off) > 14)){
        const left = off < 0;
        arArrow(ctx, left ? 56 : W - 56, cy, left ? 1 : -1, '#E8892A');
        arLabel(ctx, `${home ? tgt.name + ': ' : ''}${left ? 'влево' : 'вправо'} ещё ${Math.round(Math.abs(off))}°`, W / 2, H - 104);
      }
    }
    // кольцо-прицел
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.beginPath(); ctx.arc(W / 2, cy, rr, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(20,34,43,.6)'; ctx.beginPath(); ctx.arc(W / 2, cy, rr + 4, 0, Math.PI * 2); ctx.stroke();
    if(hold > 0){ ctx.lineWidth = 8; ctx.strokeStyle = '#0B6E6E'; ctx.beginPath(); ctx.arc(W / 2, cy, rr, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.min(1, hold)); ctx.stroke(); }
    if(phase === 'center'){
      if(Math.abs(rel()) >= 10){ const toLeft = rel() > 0; arArrow(ctx, toLeft ? 56 : W - 56, cyBase(), toLeft ? 1 : -1, '#0B6E6E'); arLabel(ctx, home ? 'Вернитесь к якорю' : 'Вернитесь прямо', W / 2, H - 104); }
      else arLabel(ctx, 'Держите прямо…', W / 2, H - 104);
    }
    const ic = st.querySelector('#arInfo');
    if(ic) ic.textContent = `Найдено ${M.found} · поворот ${Math.round(Math.max(0, s * rel()))}°${ori.got ? '' : ' · демо'}`;
  }
  if(home) toAnchor(); else toCenter();
  hintFade(st, 5000);
  raf = requestAnimationFrame(step);
  return {
    pause(){ paused = true; pauseAt = performance.now(); },
    resume(){ paused = false; const now = performance.now(); last = now; if(phase === 'seek') tStart += now - pauseAt; },
    finish(){
      done = true; cancelAnimationFrame(raf); ori.stop();
      window.removeEventListener('keydown', kd); window.removeEventListener('resize', size);
      if(stream) stream.getTracks().forEach(t => t.stop());
      if(pendingRec) M.trials.push(pendingRec), M.cues.push(pendingRec.cue);
      const n = M.found + M.missed;
      return {level0:M.level0, level1:level, target:home ? 'home' : 'star', found:M.found, missed:M.missed, meanTime:mean(M.times),
        maxTurn:Math.round(M.maxA), mode:ori.got ? 'gyro' : 'demo', cueMean:M.cues.length ? Math.round(mean(M.cues) * 10) / 10 : null,
        noCue:n ? M.noCue / n : null, actDone:M.actDone, actFail:M.actFail, trials:M.trials.slice(-40)};
    }
  };
}

/* --- 4. Бдительность: go/no-go с предупреждающим сигналом --- */
function ALERT(st, o){
  st.innerHTML = `<div class="alert-stage"><div class="stim" id="stim"></div></div><div class="stage-hint">Касайтесь экрана, когда появляется фигура. Красный знак «стоп» не трогайте.</div>`;
  const stim = st.querySelector('#stim');
  let level = o.level, paused = false, done = false, timer = 0, cur = null;
  const M = {level0:level, n:0, go:0, hit:0, miss:0, nogo:0, fa:0, rts:[]};
  let ep = {n:0, c:0};
  const disp = () => Math.max(520, 1150 - 60 * level), isi = () => 700 + Math.random() * Math.max(500, 1700 - 70 * level);
  const GO = [
    '<circle cx="50" cy="50" r="40" fill="#0B6E6E"/>',
    '<rect x="14" y="14" width="72" height="72" rx="14" fill="#2A78D6"/>',
    `<path d="${starPath(50, 52, 44)}" fill="#E8892A"/>`,
    '<path d="M50 8L92 88H8Z" fill="#6B5BA8"/>'
  ];
  const NOGO = '<path d="M33 6H67L94 33V67L67 94H33L6 67V33Z" fill="#B42318"/><text x="50" y="58" text-anchor="middle" font-size="21" font-weight="800" fill="#fff" font-family="Manrope,system-ui,sans-serif">СТОП</text>';
  const schedule = () => { clearTimeout(timer); timer = setTimeout(trial, isi()); };
  function trial(){
    if(paused || done) return;
    const nogo = Math.random() < .2, warn = Math.random() < .3;
    const show = () => {
      if(paused || done) return;
      cur = {nogo, t:performance.now(), resp:false};
      const jx = level >= 5 ? (Math.random() - .5) * (level - 4) * 7 : 0;
      stim.style.transform = `translateX(${jx}vw)`;
      stim.innerHTML = `<svg viewBox="0 0 100 100">${nogo ? NOGO : GO[Math.floor(Math.random() * GO.length)]}</svg>`;
      timer = setTimeout(endStim, disp());
    };
    if(warn){ Snd.alert(); timer = setTimeout(show, 450); } else show();
  }
  function endStim(){
    if(!cur) return;
    M.n++; ep.n++;
    if(cur.nogo){ M.nogo++; if(!cur.resp) ep.c++; }
    else{ M.go++; if(cur.resp) ep.c++; else M.miss++; }
    cur = null; stim.innerHTML = '';
    if(ep.n >= 20){ const acc = ep.c / ep.n; if(acc >= .9) level = Math.min(10, level + 1); else if(acc < .7) level = Math.max(1, level - 1); ep = {n:0, c:0}; }
    schedule();
  }
  const tap = e => {
    if(paused || done || !cur || cur.resp) return; e.preventDefault();
    cur.resp = true;
    if(cur.nogo){ M.fa++; Snd.soft(); restartAnim(stim, 'shake'); }
    else{ M.hit++; M.rts.push((performance.now() - cur.t) / 1000); Snd.ok(); stim.innerHTML = ''; }
  };
  st.addEventListener('pointerdown', tap);
  hintFade(st);
  schedule();
  return {
    pause(){ paused = true; clearTimeout(timer); cur = null; stim.innerHTML = ''; },
    resume(){ paused = false; schedule(); },
    finish(){
      done = true; clearTimeout(timer); st.removeEventListener('pointerdown', tap);
      const correct = M.hit + (M.nogo - M.fa);
      return {level0:M.level0, level1:level, trials:M.n, hits:M.hit, miss:M.miss, fa:M.fa, acc:M.n ? correct / M.n : null, rt:mean(M.rts), rtSD:sd(M.rts)};
    }
  };
}

function demoTest(form, ts, pNeg, pInt, seed){
  const rnd = mulberry32(seed), items = genTest(form), tg = items.filter(i => i.t);
  const found = tg.filter(i => rnd() < (i.x < TW / 2 ? pNeg * (.55 + i.x / TW) : pInt));
  found.sort((a, b) => (b.x - a.x) + (rnd() - .5) * 160);
  let t = 2; const taps = found.map(i => { t += 1.4 + rnd() * 2.2; return {i:i.i, t:Math.round(t * 100) / 100, x:i.x, y:i.y, tg:1, rep:false}; });
  const dis = items.filter(i => !i.t && i.x > TW / 2); if(dis.length && rnd() < .7){ const d = dis[Math.floor(rnd() * dis.length)]; taps.splice(3, 0, {i:d.i, t:taps[2] ? taps[2].t + .5 : 5, x:d.x, y:d.y, tg:0, rep:false}); }
  return {id:'demo-t' + seed, ts, form, side:'L', taps, r:scoreTest(items, taps, t + 6)};
}

  if(kind === 'window'){ g.fillStyle = '#F7FBFF'; g.fillRect(45, 28, 150, 130); g.strokeStyle = '#8A99A3'; g.strokeRect(45, 28, 150, 130); g.beginPath(); g.moveTo(120, 28); g.lineTo(120, 158); g.moveTo(45, 93); g.lineTo(195, 93); g.stroke(); }
  if(kind === 'clock'){ P('#fff', () => g.arc(120, 98, 58, 0, 7)); g.beginPath(); g.arc(120, 98, 58, 0, 7); g.stroke(); g.beginPath(); g.moveTo(120, 98); g.lineTo(120, 60); g.moveTo(120, 98); g.lineTo(150, 108); g.stroke(); }
  if(kind === 'lamp'){ P('#F2C14E', () => { g.moveTo(85, 46); g.lineTo(155, 46); g.lineTo(175, 106); g.lineTo(65, 106); g.closePath(); }); g.fillStyle = '#3B4A52'; g.fillRect(115, 106, 10, 70); g.fillRect(90, 174, 60, 10); }
  if(kind === 'cup'){ g.fillStyle = '#fff'; g.fillRect(85, 106, 60, 74); g.strokeRect(85, 106, 60, 74); g.beginPath(); g.arc(150, 142, 18, -1.2, 1.2); g.stroke(); }
  if(kind === 'picture'){ g.fillStyle = '#fff'; g.fillRect(55, 42, 130, 100); g.strokeRect(55, 42, 130, 100); P('#7FA77A', () => { g.moveTo(60, 138); g.lineTo(105, 84); g.lineTo(140, 122); g.lineTo(160, 104); g.lineTo(180, 138); g.closePath(); }); }
  g.fillStyle = 'rgba(20,34,43,.78)'; g.fillRect(0, 204, 240, 36); g.fillStyle = '#fff'; g.font = '700 18px Manrope, system-ui, sans-serif'; g.textAlign = 'center'; g.fillText('Пример: ' + label, 120, 228);
  return c.toDataURL('image/jpeg', .8);
}
function demoRoom(){
  const it = (id, kind, name, th, el) => ({id:'demo-' + id, name, photo:demoPhoto(kind, name.toLowerCase()), th, el, ts:Date.now()});
  return {anchor:{photo:demoPhoto('tv', 'якорь'), el:0, ts:Date.now()}, ts:Date.now(), items:[
    it('door', 'door', 'Дверь', -80, 4), it('lamp', 'lamp', 'Лампа', -58, -4), it('window', 'window', 'Окно', -42, 12),
    it('clock', 'clock', 'Часы', -24, 18), it('pic', 'picture', 'Картина', 30, 10), it('cup', 'cup', 'Чашка', 16, -14)]};
}
function makeDemo(){
  const d = fresh(), day = 864e5, d0 = new Date(); d0.setHours(10, 0, 0, 0);
  const start = d0.getTime() - 9 * day, rnd = mulberry32(42);
  d.demo = true; d.cfg.patient = 'PAT_DEMO'; d.cfg.specialist = 'Демо';
  const cb = (id, ts, who, ans) => ({id, ts, who, ans, total:cbsTotal(ans)});
  d.cbs.push(cb('demo-c1', start, 'cur', [2,2,3,1,2,2,2,1,1,1]), cb('demo-c2', start + 9e5, 'pt', [0,1,1,0,1,0,1,0,0,1]),
    cb('demo-c3', start + 9 * day - 3600e3 * 2, 'cur', [1,1,2,1,1,1,1,1,0,1]), cb('demo-c4', start + 9 * day - 3600e3 * 2 + 9e5, 'pt', [1,1,1,0,1,1,1,0,0,1]));
  d.tests.push(demoTest(1, start + 18e5, .42, .97, 11), demoTest(2, start + 4 * day + 18e5, .66, 1, 12), demoTest(3, start + 9 * day - 3600e3, .86, 1, 13));
  const lv = {spt:1, scan:1, ar:1, alert:1};
  for(let i = 0; i < 9; i++){
    const ts = start + i * day + 3600e3 * 5, mode = i < 5 ? 'bottom' : 'mid';
    const up = k => { const l0 = lv[k]; if(rnd() < .55) lv[k] = Math.min(10, lv[k] + 1); return [l0, lv[k]]; };
    const [a0, a1] = up('spt'), [b0, b1] = up('scan'), [c0, c1] = up('ar'), [e0, e1] = up('alert');
    const neg = .55 + i * .04 + rnd() * .05;
    d.sessions.push({id:'demo-s' + i, ts, sec:1500, mode, leftHand:false, head:false, blocks:[
      {kind:'spt', planMin:mode === 'bottom' ? 11 : 7, sec:mode === 'bottom' ? 660 : 420, level0:a0, level1:a1, probes:14, hits:10 + Math.round(i / 3), rt:.9 - i * .03, zones:[[5,5],[5,4],[4,1 + Math.round(i / 3)]]},
      {kind:'scan', planMin:7, sec:mode === 'bottom' ? 420 : 540, level0:b0, level1:b1, sheets:5, negRate:neg, intRate:.97, fp:1, cues:9 - Math.round(i * .7), early:2, oriented:null},
      {kind:'ar', planMin:4, sec:mode === 'bottom' ? 240 : 360, level0:c0, level1:c1, target:'home', found:5 + Math.round(i / 2), missed:Math.max(0, 2 - Math.floor(i / 4)), meanTime:11 - i * .5, maxTurn:35 + i * 5, mode:'gyro', cueMean:Math.round((2.7 - i * .22 + (rnd() - .5) * .3) * 10) / 10, noCue:Math.min(1, .08 + i * .07), actDone:4 + Math.round(i / 2), actFail:1},
      {kind:'alert', planMin:3, sec:180, level0:e0, level1:e1, trials:70, hits:52, miss:4, fa:3, acc:.9 + i * .005, rt:.61 - i * .01, rtSD:.14}
    ]});
  }
  d.levels = lv;
  d.room = demoRoom();
  for(let i = 0; i < 10; i++){
    const ts = start + i * day + 3600e3 * 10, k = isoDay(ts), yesN = Math.max(0, Math.round(5 - i * .4 + (rnd() - .5) * 1.5));
    const a = [0,0,0,0,0,0]; const order = [0,1,2,3,4,5].sort(() => rnd() - .5); for(let j = 0; j < yesN && j < 6; j++) a[order[j]] = 1;
    d.diary[k] = {a, ts};
  }
  return d;
}

/* ===================== СОБЫТИЯ ===================== */
const ACT = {
  go: el => go(el.dataset.v),
  loadDemo: () => { const keep = {pinHash:DB.pinHash, cfg:{...DB.cfg}}; DB = makeDemo(); if(keep.cfg.sheetUrl) DB.cfg.sheetUrl = keep.cfg.sheetUrl; DB.pinHash = keep.pinHash; save(); toast('Загружены демо-данные'); go('home'); },
  askWipe: () => {
    app.insertAdjacentHTML('beforeend', `<div class="overlay" id="wipeOv" style="position:fixed;z-index:30"><h2>Удалить все данные на этом устройстве?</h2><p>Тесты, оценки, занятия и дневник будут удалены без возможности восстановления. Отправленные в CRM записи останутся в таблице.</p>
      <div class="ov-actions"><button class="btn btn-d" data-a="wipe">Удалить</button><button class="btn btn-s" data-a="closeOv" data-v="wipeOv">Отмена</button></div></div>`);
  },
  wipe: () => { DB = fresh(); save(); pinUnlocked = false; toast('Данные удалены'); go('home'); },
  closeOv: el => { const o = document.getElementById(el.dataset.v); if(o) o.remove(); },
  startPlan: () => { const p = planFor(); if(!p.blocks.length){ toast('План пуст. Задайте минуты у специалиста.'); return; } startSession(p.blocks, p.mode); },
  startEx: el => startSession([{kind:el.dataset.v, min:exMin[el.dataset.v]}], 'single'),
  exMin: el => { exMin[el.dataset.k] = +el.dataset.v; const y = window.scrollY; render(); window.scrollTo(0, y); },
  form: el => { testForm = +el.dataset.v; render(); },
  startTest: () => startTest(),
  testGo: () => { const o = document.getElementById('tintro'); if(o) o.remove(); T.t0 = performance.now(); },
  testDone: () => testAskDone(),
  testMore: () => { const o = document.getElementById('tconfirm'); if(o) o.remove(); },
  testFinish: () => testFinish(),
  testQuit: () => {
    if(!T || !T.t0){ T = null; MODE = null; document.body.classList.remove('lock'); go('assess'); return; }
    document.getElementById('stage').insertAdjacentHTML('beforeend', `<div class="overlay" id="tquit"><h2>Прервать тест?</h2><p>Результат не сохранится.</p><div class="ov-actions"><button class="btn btn-d" data-a="testAbort">Прервать</button><button class="btn btn-s" data-a="closeOv" data-v="tquit">Продолжить тест</button></div></div>`);
  },
  testAbort: () => { T = null; MODE = null; document.body.classList.remove('lock'); go('assess'); },
  openTest: el => { viewTest = el.dataset.v; go('testRes'); },
  cbs: el => { CB = {who:el.dataset.v, ans:Array(10).fill(null)}; go('cbs'); },
  cbsAns: el => { const i = +el.dataset.i, v = +el.dataset.v; CB.ans[i] = CB.ans[i] === v ? null : v; const y = window.scrollY; renderCBS(); window.scrollTo(0, y); },
  cbsSave: () => { const total = cbsTotal(CB.ans); DB.cbs.push({id:uid(), ts:Date.now(), who:CB.who, ans:[...CB.ans], total}); save(); toast(`Сохранено: ${String(total).replace('.', ',')} из 30`); go('assess'); },
  diary: el => { const k = isoDay(Date.now()), e = DB.diary[k] || {a:[null,null,null,null,null,null]}; const i = +el.dataset.i, v = +el.dataset.v; e.a[i] = e.a[i] === v ? null : v; e.ts = Date.now(); DB.diary[k] = e; save(); const y = window.scrollY; renderDiary(); window.scrollTo(0, y); },
  blockGo: () => blockGo(),
  nextBlock: () => blockIntro(),
  runPause: () => runPause(),
  runResume: () => runResume(),
  runClosePause: () => { const ov = document.getElementById('pauseOv'); if(ov) ov.remove(); },
  runSkip: () => { const ov = document.getElementById('pauseOv'); if(ov) ov.remove(); if(RUN.ctrl){ endBlock(true); } else { RUN.i++; if(RUN.i >= RUN.blocks.length) finishSession(); else blockIntro(); } },
  runEnd: () => finishSession(),
  side: el => { DB.cfg.side = el.dataset.v; DB.head = null; save(); render(); },
  sessMin: el => { DB.cfg.sessionMin = +el.dataset.v; save(); render(); },
  toggle: el => { const k = el.dataset.v; DB.cfg[k] = !DB.cfg[k]; if(k === 'camOn' && DB.cfg.camOn && !DB.head) toast('Сначала проведите калибровку'); save(); const y = window.scrollY; render(); window.scrollTo(0, y); },
  step: el => {
    const id = el.dataset.v, d = +el.dataset.d, c = DB.cfg;
    if(id === 'gapHigh') c.gapHigh = clamp(c.gapHigh + d, c.gapLow + 1, 20);
    else if(id === 'gapLow') c.gapLow = clamp(c.gapLow + d, 0, c.gapHigh - 1);
    else if(id.startsWith('mp_')){ const k = id.slice(3); c.manualPlan[k] = clamp((c.manualPlan[k] || 0) + d, 0, 30); }
    save(); const y = window.scrollY; render(); window.scrollTo(0, y);
  },
  sync: () => syncNow(),
  gas: () => { gasOpen = !gasOpen; const y = window.scrollY; render(); window.scrollTo(0, y); },
  copyGas: async () => { try{ await navigator.clipboard.writeText(GAS_CODE); toast('Код скопирован'); }catch(e){ toast('Не удалось скопировать. Выделите код вручную.'); } },
  copyJson: async () => { const txt = JSON.stringify({app:'tura-neglect', v:APP_VER, exported:new Date().toISOString(), ...DB, pinHash:undefined,
    room:DB.room ? {items:roomItems().map(({photo, ...r}) => r)} : null}, null, 1); try{ await navigator.clipboard.writeText(txt); toast('Данные скопированы'); }catch(e){ toast('Не удалось скопировать'); } },
  setPin: async () => { const v = (document.getElementById('f_pin') || {}).value || ''; if(!/^\d{4}$/.test(v)){ toast('PIN: ровно 4 цифры'); return; } DB.pinHash = await hashPin(v); pinUnlocked = true; save(); toast('PIN установлен'); render(); },
  clearPin: () => { DB.pinHash = null; save(); toast('PIN убран'); render(); },
  pin: async el => {
    const k = el.dataset.v;
    if(k === 'del') pinBuf = pinBuf.slice(0, -1); else if(pinBuf.length < 4) pinBuf += k;
    if(pinBuf.length === 4){ const h = await hashPin(pinBuf); pinBuf = ''; if(h === DB.pinHash){ pinUnlocked = true; view = 'spec'; } else pinErr = true; }
    render();
  },
  calStart: () => runCalib(),
  cfgSet: el => { DB.cfg[el.dataset.k] = el.dataset.v; save(); const y = window.scrollY; render(); window.scrollTo(0, y); },
  openRoom: () => openRoom(view),
  roomClose: () => closeRoom(),
  roomAnchor: () => { const ph = grabPhoto(); if(!ph){ toast('Камера ещё не готова'); return; } roomSetAnchor(ph); },
  roomZero: () => { RM.ori.zero(); RM.step = 'items'; Snd.ok(); roomPanel(); },
  roomRezero: () => { RM.step = 'anchor'; roomPanel(); },
  roomResetAsk: () => { RM.step = 'reset'; roomPanel(); },
  roomResetNo: () => { RM.step = 'anchor'; roomPanel(); },
  roomReset: () => { DB.room = null; save(); RM.step = 'anchor'; roomPanel(); toast('Комната очищена'); },
  roomSnap: () => roomTakeItem(grabPhoto()),
  roomChip: el => { RM.name = el.dataset.v; const inp = document.getElementById('rmName'); if(inp) inp.value = RM.name; document.querySelectorAll('[data-a=roomChip]').forEach(b => b.classList.toggle('on', b.dataset.v === RM.name)); },
  roomRetake: () => { RM.photo = null; RM.step = 'items'; roomPanel(); },
  roomSave: () => {
    const inp = document.getElementById('rmName'), name = ((inp && inp.value) || RM.name || '').trim();
    if(!name){ toast('Введите название предмета'); return; }
    const item = {id:uid(), name:name.slice(0, 40), photo:RM.photo, th:RM.manual ? RM.manualTh : RM.th, el:RM.manual ? null : RM.el, ts:Date.now()};
    DB.room.items.push(item); DB.room.ts = Date.now(); save();
    if(!storageOK){ DB.room.items.pop(); save(); toast('Не хватает памяти. Удалите лишние предметы.'); return; }
    Snd.ok(); RM.photo = null; RM.step = 'items'; roomPanel();
  },
  roomDel: el => { DB.room.items = roomItems().filter(it => it.id !== el.dataset.v); save(); roomPanel(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if(!el || el.disabled) return;
  const fn = ACT[el.dataset.a]; if(fn){ e.preventDefault(); fn(el); }
});
document.addEventListener('input', e => {
  const el = e.target; if(!RM) return;
  if(el.id === 'rmName') RM.name = el.value;
  if(el.id === 'rmTh'){ RM.manualTh = +el.value; const l = document.getElementById('rmThL'); if(l) l.textContent = angLabel(RM.manualTh); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.dataset && el.dataset.roomFile){ const f = el.files && el.files[0]; if(f && RM) roomFromFile(f, el.dataset.roomFile); return; }
  if(!el.dataset || !el.dataset.f) return;
  DB.cfg[el.dataset.f] = el.value.trim(); save();
});
document.addEventListener('visibilitychange', () => { if(document.hidden && RUN && RUN.ctrl && !RUN.paused) runPause(); });

/* ---------- старт ---------- */
if(ENV.framed && !DB.tests.length && !DB.cbs.length && !DB.sessions.length){ DB = makeDemo(); save(); }
try{ if('serviceWorker' in navigator && !ENV.framed && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {}); }catch(e){}
render();
